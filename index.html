re effects.", "Dosage (Typical)": "6–12 g dried leaf/day as tea infusion; standardized extract: 200–500 mg/day", "Dosage Form": "Tea, Capsule, Tincture, Dried Leaf", "Timing": "Morning and early afternoon (diuretic effect—avoid late evening to prevent nocturia)", "Time to Effect": "Acute diuretic effect: 1–3 hours; Kidney/urinary benefits: 2–4 weeks of consistent use", "Side Effects": "Generally well tolerated; increased urination (expected effect); rare allergic reactions; electrolyte imbalance with excessive/prolonged use", "Contraindications": "Severe renal impairment/dialysis patients; pregnancy (insufficient safety data); electrolyte disorders; severe heart conditions requiring fluid retention", "Drug Interactions": "Diuretics (additive effect—electrolyte monitoring needed); antihypertensives (may potentiate blood pressure lowering); lithium (altered excretion risk with diuretic herbs)", "Vendor 1": "Indena S.p.A.", "Vendor 1 Product details": "Orthosiphon Standardized Extract", "Vendor 1 Origin": "Italy (processing) / Indonesia (sourced)", "Vendor 2": "PT Sido Muncul", "Vendor 2  Product details": "Tolak Angin / Kumis Kucing Jamu Preparations", "Vendor 2 Origin": "Indonesia", "Vendor 3": "Martin Bauer Group", "Vendor 3 Product details": "Java Tea / Orthosiphon Leaf", "Vendor 3 Origin": "Germany (processing) / Southeast Asia (sourced)", "FDA Status": "Not specifically GRAS; dietary supplement under DSHEA; limited US market presence; sold mainly as herbal tea", "EU Status": "Traditional herbal medicinal product status in some EU countries (HMPC monograph for urinary tract minor complaints); permitted food supplement", "India (FSSAI/AYUSH)": "FSSAI-permitted traditional herb; recognized in AYUSH-adjacent traditional Southeast Asian/Unani contexts; not a native Indian classical Ayurvedic herb but gaining market presence", "Market Applications": "Kidney/urinary health supplements; Diuretic herbal blends; Detox teas; Blood pressure support formulas; Traditional Jamu (Indonesian) medicine; Weight management (water retention)", "_id": 157, "_sheet": "Ingredients"}, {"Name": "Butcher's Broom", "Also Known As": "Ruscus aculeatus, Knee Holly, Box Holly, Jew's Myrtle, Sweet Broom", "Category": "Botanical / Vascular Health Herb", "Sub-Category": "Venotonic / Circulatory Support Herb", "Summary": "Butcher's Broom is a small evergreen shrub native to the Mediterranean and Western Europe, traditionally used since ancient Greek and Roman times for circulatory disorders. Its rhizome contains steroidal saponins (ruscogenins) that provide venotonic (vein-toning) and vasoconstrictive properties, making it a well-established treatment for chronic venous insufficiency and hemorrhoids.", "Key Benefits": "Chronic venous insufficiency relief; Hemorrhoid symptom reduction; Leg vein health (heaviness, swelling); Vasoconstriction/venotonic action; Anti-inflammatory; Lymphatic support", "Mechanism of Action": "Ruscogenins (steroidal saponins) act on alpha-1 and alpha-2 adrenergic receptors in venous smooth muscle, causing vasoconstriction; reduces capillary permeability and fragility; anti-inflammatory action reduces edema; improves venous tone and lymphatic drainage; inhibits elastase and hyaluronidase (vascular wall protection).", "Dosage (Typical)": "72–150 mg ruscogenin-standardized extract/day (typically divided 2x/day); rhizome equivalent: 1.5–3 g/day", "Dosage Form": "Capsule, Tablet, Cream/Ointment (topical for hemorrhoids), Suppository", "Timing": "With meals, divided doses (morning and evening) for sustained venous support", "Time to Effect": "Acute symptom relief (heaviness/swelling): 1–2 weeks; Full venotonic effect: 4–8 weeks", "Side Effects": "Mild GI upset, nausea; rare allergic reaction; theoretical blood pressure elevation at high doses (vasoconstrictive effect)", "Contraindications": "Hypertension (uncontrolled—vasoconstrictive action may worsen); benign prostatic hyperplasia (theoretical alpha-adrenergic concern); pregnancy (insufficient safety data)", "Drug Interactions": "Alpha-adrenergic agonists/MAOIs (potential additive vasoconstriction); antihypertensive medications (may reduce efficacy); caution with blood pressure medications generally", "Vendor 1": "Indena S.p.A.", "Vendor 1 Product details": "Ruscus Extract (standardized ruscogenins 9–11%)", "Vendor 1 Origin": "Italy", "Vendor 2": "Naturex / Givaudan", "Vendor 2  Product details": "Butcher's Broom Root Extract", "Vendor 2 Origin": "France", "Vendor 3": "Nature's Way", "Vendor 3 Product details": "Butcher's Broom Root (standardized)", "Vendor 3 Origin": "USA (sourced Europe)", "FDA Status": "Dietary supplement (DSHEA); not FDA-approved drug in US; long traditional use history", "EU Status": "Approved pharmaceutical/phytomedicine in several EU countries (Germany Commission E approved for chronic venous insufficiency); widely used as registered herbal medicine", "India (FSSAI/AYUSH)": "FSSAI-permitted botanical extract; limited traditional Ayurvedic use; growing presence in Indian vascular health supplement segment as imported ingredient", "Market Applications": "Venous health supplements; Hemorrhoid treatment products; Leg/circulation support formulas; Compression therapy adjuncts; Topical vascular creams; Travel/long-flight circulation aids", "_id": 158, "_sheet": "Ingredients"}, {"Name": "Nettle", "Also Known As": "Stinging Nettle, Urtica dioica, Common Nettle, Nettle Leaf/Root", "Category": "Botanical / Multi-System Herb", "Sub-Category": "Anti-inflammatory / Prostate & Allergy Support Herb", "Summary": "Urtica dioica (Stinging Nettle) is a perennial flowering plant found across temperate regions worldwide, used in traditional European herbal medicine for centuries. Both leaf and root are used medicinally for distinct purposes—leaf for allergies, joint health, and nutrition; root for benign prostatic hyperplasia (BPH). Rich in scopoletin, beta-sitosterol, lignans, and histamine-modulating compounds.", "Key Benefits": "Seasonal allergy relief (antihistamine); BPH symptom management (root); Joint & anti-inflammatory support; Nutritional support (leaf—iron, minerals); Diuretic action; Blood sugar regulation (preclinical); Anti-inflammatory (arthritis)", "Mechanism of Action": "Leaf inhibits histamine release and H1-receptor activity (antiallergic); root contains beta-sitosterol and lignans that inhibit 5-alpha reductase and aromatase, reducing DHT-driven prostate growth; binds sex hormone-binding globulin (SHBG) reducing free testosterone signaling in prostate tissue; anti-inflammatory via NF-κB and COX-2 inhibition; leaf is nutrient-dense (iron, calcium, vitamin K).", "Dosage (Typical)": "Leaf: 300–600 mg extract/day or 2–4 g dried leaf as tea 3x/day; Root (BPH): 360–600 mg standardized extract/day", "Dosage Form": "Capsule, Tablet, Tea, Tincture, Freeze-dried Leaf, Topical cream", "Timing": "Leaf: any time, before allergy season onset works best; Root: with meals, divided doses", "Time to Effect": "Allergy relief: 1–2 hours (acute) to 1 week (preventive); BPH symptoms: 4–8 weeks", "Side Effects": "Mild GI upset, sweating, mild diuresis; topical/fresh plant causes contact dermatitis (stinging); rare allergic reaction", "Contraindications": "Pregnancy (root—hormonal effects; leaf generally considered safer but caution advised); kidney disease (diuretic effect); diabetes (monitor glucose); on diuretics or BP medication", "Drug Interactions": "Diuretics (additive effect); antihypertensives (may potentiate); anticoagulants (nettle has mild vitamin K content—monitor warfarin); diabetes medications (may lower blood sugar additively); lithium (altered excretion)", "Vendor 1": "Martin Bauer Group / Finzelberg", "Vendor 1 Product details": "Bazoton®-uno (Nettle Root Extract, standardized)", "Vendor 1 Origin": "Germany", "Vendor 2": "Frontier Co-op / Starwest Botanicals", "Vendor 2  Product details": "Organic Nettle Leaf (cut & sifted, freeze-dried)", "Vendor 2 Origin": "USA / Eastern Europe", "Vendor 3": "Gaia Herbs", "Vendor 3 Product details": "Nettle Leaf (liquid phyto-cap)", "Vendor 3 Origin": "USA (certified organic)", "FDA Status": "GRAS for food use (cooked leaf); dietary supplement under DSHEA; long history of safe traditional use", "EU Status": "Root extract approved as phytomedicine in Germany (Commission E approved for BPH symptoms); leaf permitted as traditional herbal product (allergy, joint complaints) under HMPC monograph", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH recognizes nettle-adjacent species; gaining market in India for allergy and joint health supplements; not classical Ayurvedic herb but widely sold", "Market Applications": "Seasonal allergy/antihistamine supplements; Men's prostate health (BPH); Joint & arthritis support; Multivitamin/mineral (leaf nutrition); Hair care (scalp health); Detox/diuretic blends", "_id": 159, "_sheet": "Ingredients"}, {"Name": "Marenostrum", "Also Known As": "Marenostrumtech Biodynamic Mediterranean Botanical Extracts (grape/olive-leaf line); not a single botanical species", "Category": "Botanical Extract Brand / Ingredient Platform", "Sub-Category": "Mediterranean Biodynamic Polyphenol Extracts", "Summary": "Marenostrum is not a single plant species but a branded line of biodynamic-certified Mediterranean botanical extracts produced by the Spanish company Marenostrumtech, specializing primarily in grape (Vitis vinifera) and olive (Olea europaea) leaf/fruit-derived polyphenol extracts for nutraceutical, cosmetic, and food applications. Extracts are positioned around antioxidant and cardiovascular/skin health benefits typical of Mediterranean-diet polyphenols (resveratrol, oleuropein, hydroxytyrosol).", "Key Benefits": "Antioxidant protection (polyphenol-rich); Cardiovascular support (grape/olive polyphenols); Skin health (cosmeceutical use); Anti-inflammatory; Supports Mediterranean-diet-pattern wellness positioning", "Mechanism of Action": "Mechanism depends on the specific underlying extract supplied (grape seed/leaf polyphenols, e.g., resveratrol/proanthocyanidins, act via Nrf2 and NF-κB modulation; olive leaf/fruit extracts provide oleuropein and hydroxytyrosol with strong free-radical scavenging and endothelial-protective activity); no single standardized mechanism applies to the brand as a whole.", "Dosage (Typical)": "Not standardized—dosage is extract- and application-specific (set by formulator per the underlying grape or olive polyphenol content); no single typical human dose published for 'Marenostrum' as a generic ingredient", "Dosage Form": "Liquid Extract, Powder, Standardized Ingredient for formulation (B2B raw material, not direct-to-consumer dosage form)", "Timing": "Not applicable (B2B ingredient supplier; timing set by finished-product formulator)", "Time to Effect": "Not established (no finished-product human clinical timing data published under this brand name)", "Side Effects": "Dependent on underlying botanical (general grape/olive polyphenol profile: very well tolerated; mild GI upset possible at high doses)", "Contraindications": "General polyphenol-extract cautions apply (e.g., caution with bleeding disorders for high-dose grape extracts); no ingredient-specific contraindication data published", "Drug Interactions": "General polyphenol interaction cautions apply (CYP450 modulation possible with concentrated grape/olive polyphenols); no specific published interaction data for this brand", "Vendor 1": "Marenostrumtech", "Vendor 1 Product details": "Biodynamic Grape (Vitis vinifera) Extract", "Vendor 1 Origin": "Spain (Bigastro, Alicante region)", "Vendor 2": "Marenostrumtech", "Vendor 2  Product details": "Biodynamic Olive (Olea europaea) Leaf/Fruit Extract", "Vendor 2 Origin": "Spain", "Vendor 3": "Marenostrumtech", "Vendor 3 Product details": "Biodynamic Almond (Prunus dulcis) Extract", "Vendor 3 Origin": "Spain", "FDA Status": "Not a single FDA-regulated ingredient; underlying botanicals (grape, olive) are GRAS; B2B raw material status depends on end-use formulation", "EU Status": "Operates under EU GMP/ISO-certified facilities; underlying grape and olive extracts are well-established EU food/cosmetic ingredients; no separate EU novel food filing identified under this brand name", "India (FSSAI/AYUSH)": "Not currently identified in FSSAI's permitted ingredient list under this brand name; underlying grape and olive polyphenols are broadly accepted internationally; not an AYUSH-listed material", "Market Applications": "Cosmeceutical formulations (skin antioxidant); Nutraceutical antioxidant blends; Functional food/beverage polyphenol fortification; Premium 'Mediterranean diet' positioned supplements", "_id": 160, "_sheet": "Ingredients"}, {"Name": "Lemon Verbena", "Also Known As": "Aloysia citrodora, Aloysia triphylla, Verbena triphylla, Cedrón, Hierba Luisa", "Category": "Botanical / Aromatic Herb", "Sub-Category": "Anti-inflammatory / Digestive & Sleep-Support Herb", "Summary": "Lemon Verbena is a fragrant flowering perennial shrub native to South America (Argentina, Chile, Peru), introduced to Europe in the 17th century and now widely cultivated for culinary and medicinal use. Known for its strong lemon scent, it contains verbascoside (a potent polyphenol), citral, and luteolin, contributing to anti-inflammatory, antioxidant, digestive, and mild sedative properties.", "Key Benefits": "Digestive support (carminative); Sleep & relaxation aid; Anti-inflammatory (especially exercise-induced); Antioxidant protection; Muscle recovery support; Mild antispasmodic; Antimicrobial", "Mechanism of Action": "Verbascoside (phenylpropanoid glycoside) inhibits NF-κB and reduces pro-inflammatory cytokines (IL-6, TNF-α, CRP); provides potent free-radical scavenging activity; citral and limonene in essential oil exhibit carminative/antispasmodic action on GI smooth muscle; luteolin contributes mild GABAergic/anxiolytic activity supporting relaxation and sleep.", "Dosage (Typical)": "300–1000 mg standardized verbascoside extract/day; tea: 1–3 g dried leaf, 2–3x/day", "Dosage Form": "Tea, Capsule, Liquid Extract, Essential Oil (aromatherapy), Tincture", "Timing": "Tea: after meals (digestive) or evening (relaxation); Extract: with meals or as directed, divided doses for anti-inflammatory effect", "Time to Effect": "Acute digestive/calming effect: 30–60 minutes; Anti-inflammatory/recovery benefits: 1–4 weeks of regular use", "Side Effects": "Generally very well tolerated; rare mild GI upset; essential oil may cause skin sensitization (photosensitivity) if applied topically and exposed to sun", "Contraindications": "Pregnancy (limited safety data, traditionally avoided in high doses); known Verbenaceae family allergy; caution with photosensitizing medications (essential oil topical use)", "Drug Interactions": "Sedatives (potential mild additive relaxant effect); no major significant drug interactions documented; theoretical mild interaction with anticoagulants at very high doses", "Vendor 1": "Pranarom International", "Vendor 1 Product details": "Lemon Verbena Essential Oil (Aloysia citrodora, certified organic)", "Vendor 1 Origin": "Madagascar / France", "Vendor 2": "Martin Bauer Group", "Vendor 2  Product details": "Lemon Verbena Leaf (cut & sifted, tea grade)", "Vendor 2 Origin": "Spain / Morocco", "Vendor 3": "Naturex / Givaudan", "Vendor 3 Product details": "Verbascoside-Standardized Lemon Verbena Extract (Recoverben®)", "Vendor 3 Origin": "France / Spain", "FDA Status": "GRAS (culinary herb/flavoring); dietary supplement under DSHEA; widely sold as herbal tea", "EU Status": "Permitted food supplement; popular traditional herbal tea (Hierba Luisa/Verveine) across Mediterranean Europe and France; no specific EFSA health claim opinion", "India (FSSAI/AYUSH)": "FSSAI-permitted imported herbal tea ingredient; growing presence in premium Indian wellness/tea market; not a native Ayurvedic herb, limited AYUSH recognition", "Market Applications": "Sleep & relaxation teas; Digestive bitters/after-dinner teas; Sports recovery supplements (anti-inflammatory); Antioxidant blends; Aromatherapy products; Functional beverages", "_id": 161, "_sheet": "Ingredients"}, {"Name": "Ivy", "Also Known As": "Hedera helix, English Ivy, Common Ivy, Ivy Leaf Extract", "Category": "Botanical / Respiratory Herb", "Sub-Category": "Expectorant / Bronchial Support Herb", "Summary": "Hedera helix (English Ivy) is a climbing evergreen vine native to Europe, with leaf extract widely used in licensed phytopharmaceutical cough and bronchitis remedies, particularly in Germany and across Europe. Contains triterpene saponins (hederacoside C, alpha-hederin) that provide well-documented secretolytic, bronchospasmolytic (broncho-relaxing), and mucolytic effects, making it one of the most clinically validated herbal respiratory remedies.", "Key Benefits": "Productive cough relief (expectorant); Bronchial smooth muscle relaxation (bronchodilator-like); Mucus thinning/secretolytic action; Acute bronchitis symptom relief; Anti-inflammatory (airway); Pediatric cough support (standardized syrups)", "Mechanism of Action": "Alpha-hederin (active saponin metabolite) increases intracellular calcium in bronchial epithelial cells, triggering surfactant secretion and reducing mucus viscosity; activates beta-2 adrenergic receptors causing bronchodilation/bronchospasmolytic effect; hederacoside C is metabolized to alpha-hederin in the gut for systemic activity; reduces airway inflammation.", "Dosage (Typical)": "Standardized extract equivalent to 35–52.5 mg dried leaf/day (per EMA monograph); commercial syrups typically dosed by age/weight per product labeling", "Dosage Form": "Syrup (most common, especially pediatric), Capsule, Tablet, Drops, Lozenge", "Timing": "Divided doses (2–3x/day) with or without food; consistent use through course of respiratory illness", "Time to Effect": "Acute mucolytic/bronchospasmolytic effect: hours to 1–2 days; Full cough symptom improvement: 5–7 days of consistent use", "Side Effects": "Generally well tolerated; mild GI upset (nausea, vomiting) especially in children if overdosed; rare allergic skin reactions (contact dermatitis from fresh plant—different from standardized oral extract)", "Contraindications": "Known Araliaceae family allergy; caution in asthma with bronchospasm (rare reports of worsening—monitor); raw/fresh plant ingestion (saponins more concentrated and irritating)", "Drug Interactions": "No major significant pharmaceutical drug interactions documented; theoretical caution combining with other expectorants/mucolytics (additive effect, generally considered safe combination)", "Vendor 1": "Engelhard Arzneimittel", "Vendor 1 Product details": "Prospan® (Hedera helix Extract EA 575, standardized)", "Vendor 1 Origin": "Germany", "Vendor 2": "Bionorica SE", "Vendor 2  Product details": "Ivy Leaf Dry Extract (standardized hederacoside C)", "Vendor 2 Origin": "Germany", "Vendor 3": "Schwabe Pharmaceuticals", "Vendor 3 Product details": "Hedera helix Standardized Cough Syrup Base", "Vendor 3 Origin": "Germany", "FDA Status": "Not FDA-approved as drug in US; limited dietary supplement market presence; primarily sold/used in Europe as licensed phytomedicine", "EU Status": "Widely approved as licensed phytopharmaceutical (e.g., Prospan®) across EU for acute bronchitis and productive cough; EMA/HMPC well-established monograph with extensive clinical evidence; one of the most validated EU herbal cough remedies including for children", "India (FSSAI/AYUSH)": "FSSAI status limited for concentrated standardized extract; not a classical AYUSH herb; imported European ivy-leaf cough syrups available in premium Indian pharmacy/OTC market", "Market Applications": "Cough & cold remedies (especially pediatric); Bronchitis/respiratory syrups; OTC phytopharmaceutical cough products; Combination cold/flu formulas; Respiratory wellness supplements", "_id": 162, "_sheet": "Ingredients"}, {"Name": "Harpagofito", "Also Known As": "Devil's Claw, Harpagophytum procumbens, Grapple Plant, Wood Spider, Harpago", "Category": "Botanical / Anti-inflammatory Herb", "Sub-Category": "Anti-inflammatory / Joint Health Herb", "Summary": "Harpagophytum procumbens (Devil's Claw), known as Harpagofito in Spanish/Portuguese, is a tuberous plant native to the Kalahari Desert region of Southern Africa (Namibia, Botswana, South Africa). Traditionally used by indigenous Khoisan peoples, its secondary tuber is now one of the most clinically validated herbal anti-inflammatory and analgesic remedies, widely used in Europe for osteoarthritis and lower back pain.", "Key Benefits": "Osteoarthritis pain relief; Lower back pain reduction; Anti-inflammatory action; Joint mobility improvement; Mild analgesic effect; Digestive bitter (traditional secondary use)", "Mechanism of Action": "Harpagoside (primary iridoid glycoside) inhibits COX-2 and 5-LOX enzymes, reducing prostaglandin E2 and leukotriene synthesis; suppresses NF-κB activation and pro-inflammatory cytokine production (TNF-α, IL-1β, IL-6); inhibits elastase and hyaluronidase (cartilage-protective); comparable mechanism to NSAIDs but with gentler GI profile.", "Dosage (Typical)": "50–100 mg harpagoside/day (standardized extract, typically 600–800 mg dried extract 2–3x/day)", "Dosage Form": "Capsule, Tablet, Liquid Extract, Tea, Topical Cream/Gel", "Timing": "With meals (reduces GI upset); divided doses 2–3x/day for sustained anti-inflammatory effect", "Time to Effect": "Acute pain relief: 1–2 weeks; Full anti-inflammatory/joint benefit: 4–8 weeks of consistent use", "Side Effects": "Mild GI upset, diarrhea, nausea; rare allergic reaction; bitter taste (traditional digestive use); headache (uncommon)", "Contraindications": "Peptic ulcer or gastritis (bitter/secretagogue effect may worsen); gallstones (increases gastric/bile secretion); pregnancy (uterine stimulant concern—traditionally avoided); cardiac arrhythmia (theoretical—monitor)", "Drug Interactions": "Anticoagulants/antiplatelets (theoretical additive bleeding risk—monitor); antidiabetic medications (may have mild hypoglycemic additive effect); proton pump inhibitors/H2 blockers (may reduce harpagoside absorption—gastric acid dependent); antiarrhythmics (theoretical caution)", "Vendor 1": "Finzelberg / Martin Bauer Group", "Vendor 1 Product details": "Devil's Claw Standardized Extract (harpagoside 3%)", "Vendor 1 Origin": "Germany (processing) / Namibia (wild-harvested)", "Vendor 2": "Indena S.p.A.", "Vendor 2  Product details": "Harpagophytum Dry Extract (standardized)", "Vendor 2 Origin": "Italy (processing) / Southern Africa (sourced)", "Vendor 3": "Arkocaps / Arkopharma", "Vendor 3 Product details": "Harpagophytum Devil's Claw Capsules", "Vendor 3 Origin": "France (formulated) / Namibia/South Africa (sourced)", "FDA Status": "Dietary supplement under DSHEA; not FDA-approved as drug; widely sold in US supplement market for joint health", "EU Status": "Approved phytomedicine/licensed herbal product in several EU countries (Germany Commission E approved for degenerative joint disorders and back pain); strong HMPC traditional and well-established use monograph", "India (FSSAI/AYUSH)": "FSSAI-permitted imported botanical extract; not a classical Ayurvedic herb (African origin); growing presence in Indian joint health supplement market as imported ingredient", "Market Applications": "Joint health / osteoarthritis supplements; Back pain relief formulas; Sports recovery (anti-inflammatory); Topical pain relief creams; Combination formulas with glucosamine/turmeric; Digestive bitters (traditional)", "_id": 163, "_sheet": "Ingredients"}, {"Name": "Granada", "Also Known As": "Pomegranate, Punica granatum, Granada (Spanish for Pomegranate)", "Category": "Botanical / Functional Fruit", "Sub-Category": "Antioxidant Polyphenol Fruit Extract", "Summary": "Granada is the Spanish name for pomegranate (Punica granatum), an ancient fruit native to the region spanning Iran to northern India, now cultivated worldwide including extensively in Spain (where the city of Granada takes its name from the fruit). The fruit, juice, and peel are rich in punicalagins, ellagic acid, and anthocyanins—among the most potent dietary antioxidants studied, with strong evidence for cardiovascular and prostate health.", "Key Benefits": "Cardiovascular health (antioxidant, anti-atherosclerotic); Antioxidant protection; Prostate health; Anti-inflammatory; Skin health; Exercise recovery; Cognitive support (preliminary)", "Mechanism of Action": "Punicalagins and ellagic acid are converted by gut microbiota into urolithins (notably urolithin A), which exhibit potent anti-inflammatory and mitophagy-promoting activity; inhibits LDL oxidation and reduces arterial plaque formation; inhibits ACE (angiotensin-converting enzyme) supporting blood pressure regulation; anthocyanins provide direct free-radical scavenging.", "Dosage (Typical)": "240–330 ml pomegranate juice/day; standardized extract: 250–1000 mg/day (punicalagin-standardized)", "Dosage Form": "Juice, Capsule, Tablet, Liquid Extract, Powder", "Timing": "With or without food; juice often consumed morning; extract divided doses for sustained antioxidant levels", "Time to Effect": "Acute antioxidant rise: 1–3 hours; Cardiovascular benefits: 4–12 weeks; Prostate PSA effects: 6+ months", "Side Effects": "Generally very well tolerated; mild GI upset (juice form, due to sugar/acidity); rare allergic reaction", "Contraindications": "Low blood pressure (additive hypotensive effect); ongoing anticoagulant therapy (monitor); diabetes (juice form—monitor blood sugar due to natural sugars)", "Drug Interactions": "Antihypertensives (may potentiate blood pressure lowering); warfarin (case reports of altered INR via CYP2C9 inhibition—monitor); statins (mild CYP3A4 interaction reported)", "Vendor 1": "POM Wonderful", "Vendor 1 Product details": "100% Pomegranate Juice (California-grown)", "Vendor 1 Origin": "USA (California)", "Vendor 2": aker/non-addictive binding) and inhibits GABA transaminase, increasing available GABA; valepotriates and sesquiterpenes contribute sedative effects; interacts with serotonin (5-HT5a) receptors; exact mechanism considered multi-compound synergistic rather than single-molecule.", "Dosage (Typical)": "300–600 mg standardized root extract (0.8% valerenic acid) 30–60 min before bed; anxiety: 120–200 mg 2–3x/day", "Dosage Form": "Capsule, Tablet, Tincture, Tea, Liquid Extract", "Timing": "30–60 minutes before bedtime (sleep); divided doses through day for anxiety/tension", "Time to Effect": "Acute sedative effect: 30 min–2 hours; Sleep quality improvement: cumulative effect over 2–4 weeks of regular use", "Side Effects": "Mild headache, GI upset, dizziness, vivid dreams; rare paradoxical stimulation; morning grogginess at high doses", "Contraindications": "Pregnancy/breastfeeding (insufficient safety data); liver disease (rare hepatotoxicity case reports); before surgery (sedative interaction with anesthesia—discontinue 2 weeks prior)", "Drug Interactions": "CNS depressants/sedatives/alcohol (significant additive sedation risk); benzodiazepines (additive effect—caution); anesthesia (discontinue before surgery); CYP3A4 substrates (mild interaction potential)", "Vendor 1": "Finzelberg / Martin Bauer Group", "Vendor 1 Product details": "Valerian Root Dry Extract (standardized valerenic acid)", "Vendor 1 Origin": "Germany", "Vendor 2": "Nature's Way", "Vendor 2  Product details": "Valerian Premium Extract (0.8% valerenic acids)", "Vendor 2 Origin": "USA (sourced Europe)", "Vendor 3": "Indena S.p.A.", "Vendor 3 Product details": "Valeriana officinalis Standardized Extract", "Vendor 3 Origin": "Italy", "FDA Status": "Dietary supplement under DSHEA; GRAS for food flavoring use; long history of OTC sleep aid sales in USA", "EU Status": "EMA/HMPC recognized as well-established herbal medicine for sleep and mild nervous tension; widely approved as licensed phytomedicine across EU member states", "India (FSSAI/AYUSH)": "FSSAI-permitted imported botanical; not a classical Ayurvedic herb (European/Asian native) but Tagar (Valeriana wallichii, related Indian species) is AYUSH-recognized for similar sedative use", "Market Applications": "Sleep aid supplements; Anxiety/stress relief formulas; PMS/menstrual support products; Combination calming blends (with passionflower, hops, lemon balm); OTC sleep products", "_id": 165, "_sheet": "Ingredients"}, {"Name": "Grape extract", "Also Known As": "Vitis vinifera Extract, Grape Seed Extract (GSE), Grape Skin Extract, MegaNatural®, Resveratrol source", "Category": "Botanical / Polyphenol Extract", "Sub-Category": "Proanthocyanidin / Antioxidant Extract", "Summary": "Grape extract is derived from Vitis vinifera (common grape vine), typically from seeds (richest in oligomeric proanthocyanidins/OPCs) or skin (richest in resveratrol and anthocyanins). One of the most studied polyphenol sources globally, grape extract underlies the 'French Paradox' research linking moderate wine consumption to cardiovascular protection, though concentrated extracts provide benefits without alcohol.", "Key Benefits": "Cardiovascular health (antioxidant, vascular protection); Antioxidant protection (highest OPC content of common extracts); Skin health & anti-aging; Vein/circulation health (chronic venous insufficiency); Anti-inflammatory; Eye health (retinal protection)", "Mechanism of Action": "Oligomeric proanthocyanidins (OPCs) provide potent free-radical scavenging (50x stronger than Vitamin E in some assays); inhibit LDL oxidation; strengthen collagen/elastin cross-linking (vascular and skin structural support); reduce capillary permeability and fragility; resveratrol (skin extract) activates SIRT1 and provides additional cardioprotective signaling.", "Dosage (Typical)": "150–300 mg grape seed extract/day (standardized to 95% proanthocyanidins); skin extract/resveratrol: 100–250 mg/day", "Dosage Form": "Capsule, Tablet, Liquid Extract, Powder", "Timing": "With meals (improves absorption and reduces GI upset); morning or divided doses", "Time to Effect": "Acute antioxidant rise: 1–2 hours; Vascular/circulation benefits: 4–8 weeks; Skin benefits: 8–12 weeks", "Side Effects": "Generally very well tolerated; mild headache, GI upset, scalp itching (rare); theoretical mild blood-thinning effect at high doses", "Contraindications": "Bleeding disorders; before surgery (≥2 weeks discontinuation recommended); concurrent high-dose anticoagulant therapy", "Drug Interactions": "Anticoagulants/antiplatelets (additive bleeding risk—monitor); CYP3A4, CYP2C9 substrate drugs (mild inhibition possible); chemotherapy agents (antioxidant interference—oncologist guidance advised)", "Vendor 1": "Polyphenolics Inc. / MegaNatural", "Vendor 1 Product details": "MegaNatural®-BP / Grape Seed Extract (95% OPC)", "Vendor 1 Origin": "USA (California)", "Vendor 2": "Indena S.p.A.", "Vendor 2  Product details": "Leucoselect® Phytosome (grape seed extract, enhanced bioavailability)", "Vendor 2 Origin": "Italy", "Vendor 3": "Naturex / Givaudan", "Vendor 3 Product details": "Grape Skin/Seed Extract (standardized polyphenols + resveratrol)", "Vendor 3 Origin": "France", "FDA Status": "GRAS; dietary supplement under DSHEA; widely sold OTC supplement with extensive safety history", "EU Status": "Permitted food supplement; EFSA positive opinion on grape seed extract contributing to maintenance of normal blood circulation (qualified claim); widely available across EU", "India (FSSAI/AYUSH)": "FSSAI-permitted; growing presence in Indian cardiovascular and antioxidant supplement market; not a classical AYUSH ingredient but grape (Draksha) is recognized in Ayurveda generally", "Market Applications": "Cardiovascular health supplements; Antioxidant/anti-aging blends; Skin care (cosmeceutical, collagen support); Vein health/circulation products; Eye health formulas; Sports recovery", "_id": 166, "_sheet": "Ingredients"}, {"Name": "r -climate fatigue and stress, it is now one of the most clinically studied adaptogens, standardized to rosavins and salidroside.", "Key Benefits": "Mental fatigue reduction; Physical stamina & endurance; Stress resilience (HPA axis modulation); Mood support / mild antidepressant effect; Cognitive performance under stress; Burnout recovery support", "Mechanism of Action": "Salidroside and rosavins modulate HPA axis cortisol response, blunting excessive stress hormone release; influence monoamine neurotransmitters (serotonin, dopamine, norepinephrine) by inhibiting MAO and COMT enzymes; activate heat shock protein (HSP70) expression for cellular stress resistance; enhance mitochondrial ATP production and reduce exercise-induced oxidative damage.", "Dosage (Typical)": "200–600 mg/day standardized extract (3% rosavins, 1% salidroside ratio 3:1)", "Dosage Form": "Capsule, Tablet, Tincture, Powder", "Timing": "Morning, on empty stomach 30 min before breakfast (avoid evening—may be stimulating/affect sleep)", "Time to Effect": "Acute mental/physical energy: 30–60 minutes; Sustained stress resilience/mood benefits: 1–4 weeks", "Side Effects": "Generally well tolerated; mild jitteriness, insomnia if taken late in day, dry mouth, dizziness at high doses", "Contraindications": "Bipolar disorder (may trigger manic episode—stimulating adaptogen, caution advised); pregnancy/breastfeeding (insufficient safety data); autoimmune conditions (theoretical immune-stimulating concern)", "Drug Interactions": "Antidepressants/MAOIs (theoretical additive serotonergic/monoaminergic effect—caution); stimulants (additive overstimulation risk); diabetes medications (may have mild blood sugar lowering additive effect)", "Vendor 1": "Swedish Herbal Institute", "Vendor 1 Product details": "SHR-5 (clinically studied standardized Rhodiola extract)", "Vendor 1 Origin": "Sweden (sourced Russia/Siberia)", "Vendor 2": "Gaia Herbs", "Vendor 2  Product details": "Rhodiola Rosea (liquid phyto-cap, standardi entation before this entry is finalized.", "Key Benefits": "Supports positive mood and emotional balance; traditional and clinically-studied support for mild-to-moderate depressive symptoms; mild nervine/calming action", "Mechanism of Action": "Hyperforin inhibits synaptic reuptake of serotonin, dopamine, norepinephrine and GABA non-selectively (similar in net effect to some pharmaceutical antidepressant classes); hypericin contributes antioxidant and mild MAO-modulating activity, though hyperforin is now considered the primary active constituent for mood effects.", "Dosage (Typical)": "300 mg, 2-3x/day standardized extract (typically 0.3% hypericin or 3-5% hyperforin standardization), totaling 600-900 mg/day in most clinical studies", "Dosage Form": "Standardized dry extract capsule/tablet; liquid tincture/extract", "Timing": "With food, divided 2-3x/day; consistent daily use required for effect", "Time to Effect": "4-6 weeks for measurable mood-related outcomes, consistent with antidepressant-class onset patterns", "Side Effects": "Photosensitivity (notable and well-documented), GI upset, dizziness, dry mouth, fatigue, restlessness", "Contraindications": "Pregnancy/lactation, bipolar disorder (risk of triggering manic episode), planned surgery, photosensitive skin conditions, concurrent use of serotonergic medications", "Drug Interactions": "MAJOR: potent CYP3A4/CYP2C9/P-glycoprotein inducer - reduces efficacy of oral contraceptives, anticoagulants (warfarin), immunosuppressants (cyclosporine, tacrolimus), certain anti-HIV and anticancer drugs; serotonin syndrome risk with SSRIs/SNRIs/MAOIs/triptans - HITL HIGH-PRIORITY REVIEW required for any co-formulation or co-use scenario", "Vendor 1": "Vendor identity for \"Venga\" not independently confirmed", "Vendor 1 Product details": "Could not verify a recognized branded St. John's Wort extract under the name \"Venga\" in available trade/industry sources - recommend confirming spelling, vendor, and product spec directl
