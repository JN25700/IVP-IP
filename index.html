nt indications based on current evidence", "_id": 205, "_sheet": "Ingredients"}, {"Name": "liquorice", "Also Known As": "Glycyrrhiza glabra, Licorice, Mulethi, Yashtimadhu, Sweet Root, Glycyrrhizin source", "Category": "Botanical / Multi-System Herb", "Sub-Category": "Demulcent / Gastroprotective & Adaptogenic Herb", "Summary": "Glycyrrhiza glabra (Liquorice/Licorice) is a perennial legume native to the Mediterranean and parts of Asia, with one of the longest documented histories of medicinal use across Ayurveda (Yashtimadhu), Traditional Chinese Medicine, and European herbalism. Its root contains glycyrrhizin, glabridin, and flavonoids, well-supported for gut/digestive health (gastric ulcer protection) and with documented but more complex/dose-limited cardiovascular relevance (glycyrrhizin raises blood pressure at high doses, a key safety caveat); bone/joint evidence is more limited and indirect.", "Key Benefits": "Gastric ulcer & GERD symptom relief (especially DGL form); Adaptogenic/anti-inflammatory support; Respiratory/cough soothing (demulcent); Skin health (glabridin, topical depigmenting use); Mild estrogenic/hormonal modulation (preliminary bone relevance); CAUTION: standard licorice can raise blood pressure, opposing a simple 'heart health' framing", "Mechanism of Action": "Glycyrrhizin is metabolized to glycyrrhetinic acid, which inhibits 11-beta-hydroxysteroid dehydrogenase type 2, causing cortisol to act on mineralocorticoid receptors (pseudoaldosteronism)—this explains both anti-inflammatory/adaptogenic effects AND the blood-pressure-raising risk; flavonoids (glabridin) inhibit Helicobacter pylori growth and increase gastric mucus production/prostaglandin synthesis (gastroprotective mechanism); deglycyrrhizinated licorice (DGL) retains gut-protective flavonoids while removing the glycyrrhizin responsible for BP/cardiac risk.", "Dosage (Typical)": "DGL (deglycyrrhizinated): 380–760 mg chewable, before meals, for gut health; Standard root/extract: limit to ≤100 mg glycyrrhizin/day for general use due to BP risk", "Dosage Form": "Capsule, Chewable Tablet (DGL common form), Tea, Liquid Extract, Lozenge", "Timing": "DGL: 20 minutes before meals, 2–3x/day; standard extract: with food, short-term use only recommended", "Time to Effect": "Gut/GERD symptom relief (DGL): 1–2 weeks; General adaptogenic effects: 2–4 weeks (short-term use advised for standard glycyrrhizin-containing forms)", "Side Effects": "Standard licorice (non-DGL): hypertension, hypokalemia, edema, headache, and cardiac arrhythmia risk with prolonged/high-dose use; DGL form: generally very well tolerated, mild GI upset only", "Contraindications": "Hypertension (standard licorice contraindicated—use DGL only); cardiac arrhythmia or heart failure; kidney disease; pregnancy (associated with preterm birth risk at high glycyrrhizin intake in some studies); hypokalemia", "Drug Interactions": "Diuretics (significant additive hypokalemia risk with standard licorice); digoxin (increased toxicity risk via hypokalemia—standard licorice contraindicated); antihypertensive medications (standard licorice antagonizes/reduces efficacy); corticosteroids (additive mineralocorticoid-like effect); oral contraceptives (may increase fluid retention/BP effect)", "Vendor 1": "Sabinsa Corporation", "Vendor 1 Product details": "Glycyrrhiza glabra Extract (standardized glycyrrhizin and DGL forms)", "Vendor 1 Origin": "India", "Vendor 2": "Enzymatic Therapy / PhytoPharmica", "Vendor 2  Product details": "DGL Licorice Chewable Tablets", "Vendor 2 Origin": "USA (sourced Mediterranean/Middle East)", "Vendor 3": "Baidyanath Ayurved", "Vendor 3 Product details": "Yashtimadhu Churna / Mulethi (classical Ayurvedic preparation)", "Vendor 3 Origin": "India", "FDA Status": "DGL: GRAS, dietary supplement under DSHEA; standard licorice: FDA has issued consumer warnings regarding cardiac risk (arrhythmia) from excessive licorice candy/extract consumption", "EU Status": "EU regulates glycyrrhizin content in food (maximum levels apply, with mandatory warning labeling above defined thresholds in confectionery/beverages); DGL and standardized extracts permitted as food supplements", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Yashtimadhu (Glycyrrhiza glabra) as a major classical Ayurvedic herb for digestive, respiratory, and Rasayana (rejuvenative) applications", "Market Applications": "Digestive/gut health supplements (DGL, strong evidence); Cough/throat soothing products; Ayurvedic formulations (Yashtimadhu); Adaptogen/stress blends (short-term use); NOTE: standard (non-DGL) licorice requires explicit cardiovascular caution rather than blanket 'heart health' positioning", "_id": 206, "_sheet": "Ingredients"}, {"Name": "Long pepper", "Also Known As": "Piper longum, Pippali, Indian Long Pepper, Javanese Long Pepper, Piperine source", "Category": "Botanical / Spice-Medicinal Herb", "Sub-Category": "Bioavailability Enhancer / Digestive & Respiratory Herb", "Summary": "Piper longum (Long Pepper/Pippali) is a flowering vine native to India and Southeast Asia, one of the most important herbs in classical Ayurveda, traditionally used for respiratory conditions, digestive complaints, and notably as a bioavailability enhancer (piperine inhibits drug-metabolizing enzymes, increasing absorption of co-administered nutrients/drugs). The user-provided pairing (immunity, gut & intestinal health) aligns reasonably well with its traditional and modern evidence base.", "Key Benefits": "Digestive stimulation & gut health (classical Ayurvedic 'deepana-pachana' carminative action); Immune modulation & respiratory support; Bioavailability enhancement (piperine—improves absorption of curcumin, nutrients, some drugs); Anti-inflammatory; Antimicrobial; Bronchodilator/respiratory (traditional cough/asthma use)", "Mechanism of Action": "Piperine inhibits CYP3A4 and P-glycoprotein, slowing metabolism/increasing systemic bioavailability of co-administered compounds (most famously curcumin, where piperine increases bioavailability up to 2000% in some studies); stimulates digestive enzyme secretion (amylase, lipase, trypsin) supporting the traditional digestive/carminative use; modulates macrophage and cytokine activity supporting immune effects; demonstrates antimicrobial activity against several respiratory pathogens.", "Dosage (Typical)": "250–500 mg standardized extract/day (5–10% piperine); whole fruit powder: 1–3 g/day (often combined in Trikatu with ginger and black pepper)", "Dosage Form": "Capsule, Tablet, Powder (Churna), Decoction, Combination formulas (Trikatu)", "Timing": "With or after meals (digestive support); often combined with other herbs/nutrients to enhance their absorption", "Time to Effect": "Acute digestive stimulant effect: 30–60 minutes; Immune/respiratory benefits: 2–4 weeks of consistent traditional use", "Side Effects": "GI upset, heartburn (pungent/hot herb) at high doses; increased absorption of co-administered drugs can be a double-edged effect (risk of toxicity from increased drug levels)", "Contraindications": "Peptic ulcer disease or active GI inflammation (pungent/heating herb may aggravate); pregnancy (traditionally used cautiously at high doses); concurrent use with narrow-therapeutic-index drugs (due to bioavailability-enhancing/CYP-inhibiting effect)", "Drug Interactions": "SIGNIFICANT: increases bioavailability/blood levels of many co-administered drugs via CYP3A4 and P-glycoprotein inhibition—relevant for phenytoin, propranolol, theophylline, and several other medications; requires caution and possible dose adjustment with prescription drugs generally", "Vendor 1": "Sami Labs / Sabinsa", "Vendor 1 Product details": "Piperine 95% (standardized, often as Bioperine® or similar)", "Vendor 1 Origin": "India", "Vendor 2": "Arjuna Natural", "Vendor 2  Product details": "Piper longum Standardized Extract", "Vendor 2 Origin": "India (Kerala)", "Vendor 3": "Baidyanath Ayurved", "Vendor 3 Product details": "Pippali Churna (classical Ayurvedic powder)", "Vendor 3 Origin": "India", "FDA Status": "Dietary supplement under DSHEA; piperine (as Bioperine®) widely recognized GRAS bioavailability-enhancing ingredient in combination supplements", "EU Status": "Permitted food supplement and spice ingredient; piperine-containing bioavailability-enhancer blends widely sold across EU supplement market", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Pippali as one of the most important classical Ayurvedic herbs (part of Trikatu and many Rasayana formulations) for digestive and respiratory health", "Market Applications": "Digestive/gut health supplements; Immune & respiratory support formulas; Bioavailability-enhancer ingredient (paired with curcumin, other nutrients); Classical Ayurvedic combination products (Trikatu); Spice/culinary use", "_id": 207, "_sheet": "Ingredients"}, {"Name": "Mint leaf", "Also Known As": "Mentha (Mentha spicata/Mentha piperita), Pudina, Spearmint, Peppermint", "Category": "Botanical / Culinary-Medicinal Herb", "Sub-Category": "Digestive & Respiratory Aromatic Herb", "Summary": "Mint refers primarily to Mentha species (spearmint and peppermint being most common), aromatic perennial herbs native to Europe, Asia, and the Mediterranean, now cultivated worldwide and deeply embedded in Indian cuisine (Pudina) and traditional medicine. Well-documented for digestive health (IBS, dyspepsia—particularly peppermint oil) and with reasonable supporting evidence for the user-stated immunity and heart health angles being secondary/supportive rather than primary, though women's health (spearmint, anti-androgenic/PCOS research) has distinct, separate evidence.", "Key Benefits": "Digestive health (peppermint oil, IBS symptom relief—strongest evidence, not in user's stated list); Respiratory/decongestant support (menthol); Anti-androgenic effect (spearmint, women's health/PCOS-related, specific evidence); Antimicrobial (oral/respiratory); Antioxidant (general, indirect cardiovascular relevance); Cognitive alertness (aromatherapy)", "Mechanism of Action": "Menthol (peppermint) activates TRPM8 cold receptors and has antispasmodic action on GI smooth muscle via calcium channel blockade—core mechanism for IBS relief; menthol and carvone exhibit antimicrobial activity against respiratory pathogens; spearmint's rosmarinic acid and other compounds appear to reduce free and total testosterone in studies on hirsutism, supporting the women's health application; antioxidant flavonoids provide general free-radical scavenging with indirect cardiovascular relevance.", "Dosage (Typical)": "Peppermint oil (enteric-coated, IBS): 0.2–0.4 ml, 2–3x/day; Spearmint tea (women's health): 2 cups/day; General leaf/tea: 1–3 g dried leaf, steeped, 2–3x/day", "Dosage Form": "Tea, Essential Oil (enteric-coated capsules for IBS), Tincture, Fresh/Dried Leaf, Topical (menthol balms)", "Timing": "Peppermint oil: between meals, on empty stomach (enteric-coated to avoid heartburn); Tea: after meals or any time", "Time to Effect": "Acute digestive/decongestant effect: 30 minutes–2 hours; Women's health (spearmint, hormonal): 4–8 weeks of consistent use; Immune/respiratory: symptomatic, acute use", "Side Effects": "Heartburn/GERD worsening (especially peppermint oil if not enteric-coated, due to relaxation of lower esophageal sphincter); allergic reaction (rare); skin irritation (topical menthol at high concentration)", "Contraindications": "GERD/reflux disease (peppermint oil specifically, non-enteric-coated forms, may worsen symptoms by relaxing esophageal sphincter); hiatal hernia; gallstones (mint may stimulate bile flow); pregnancy (high-dose essential oil generally avoided)", "Drug Interactions": "Antacids/PPIs (enteric coating of peppermint capsules can be prematurely dissolved by acid-reducing medications, causing heartburn—timing separation advised); cyclosporine (peppermint oil may affect CYP3A4 metabolism); theoretical mild interaction with antihypertensives via vasodilatory effect", "Vendor 1": "Martin Bauer Group / Finzelberg", "Vendor 1 Product details": "Peppermint Oil Enteric-Coated Capsules / Mentha piperita Extract", "Vendor 1 Origin": "Germany / India", "Vendor 2": "Himalaya Drug Company", "Vendor 2  Product details": "Pudina Hara / Mint Leaf Extract (Ayurvedic preparation)", "Vendor 2 Origin": "India", "Vendor 3": "Frontier Co-op", "Vendor 3 Product details": "Organic Spearmint Leaf (cut & sifted)", "Vendor 3 Origin": "USA / Egypt", "FDA Status": "GRAS (food/culinary herb); enteric-coated peppermint oil sold as dietary supplement (DSHEA) and recognized for digestive support", "EU Status": "Peppermint oil has Commission E approval (Germany) and HMPC traditional herbal medicinal product status for dyspepsia and IBS symptoms; widely permitted food supplement across EU", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Pudina for digestive, respiratory, and general wellness applications; one of the most common kitchen-medicine herbs in Indian households", "Market Applications": "Digestive health supplements (peppermint oil, IBS—strongest evidence); Women's health/PCOS support (spearmint tea, specific niche); Respiratory/cold relief products (menthol); Culinary/flavoring (very widespread); Oral care (antimicrobial)", "_id": 208, "_sheet": "Ingredients"}, {"Name": "Mustard", "Also Known As": "Brassica nigra (black), Brassica juncea (brown/Indian), Sinapis alba (white/yellow), Rai/Sarson, Mustard Seed", "Category": "Botanical / Culinary-Medicinal Seed", "Sub-Category": "Glucosinolate-Rich Spice & Functional Oil Seed", "Summary": "Mustard refers to several Brassica/Sinapis species cultivated worldwide for their pungent seeds, used as a spice, condiment, and source of mustard oil—deeply embedded in Indian cuisine (Sarson/Rai) and traditional medicine. Rich in glucosinolates (sinigrin) which convert to allyl isothiocyanate, mustard has documented antimicrobial and digestive properties, with the user-stated immunity and gut/intestinal pairing reasonably aligned, though direct heart-health evidence is more nuanced (mustard oil's fatty acid profile has generated both supportive and cautionary cardiovascular research).", "Key Benefits": "Digestive stimulation (carminative, traditional Ayurvedic use); Antimicrobial/antibacterial (glucosinolate breakdown products); Anti-inflammatory (topical and internal use); Respiratory/decongestant (traditional mustard plaster/steam use); Cardiovascular relevance (mixed evidence—omega-3 ALA content vs. erucic acid caution depending on variety/processing); Topical pain relief (mustard plasters, traditional)", "Mechanism of Action": "Sinigrin (glucosinolate) is hydrolyzed by myrosinase enzyme (released when seed is crushed/chewed) into allyl isothiocyanate (AITC), which exhibits potent antimicrobial activity against various bacteria and fungi, and stimulates digestive secretions/gastric motility; AITC also has counter-irritant properties (traditional topical mustard plaster mechanism for muscle/respiratory complaints); mustard oil contains both beneficial alpha-linolenic acid (omega-3) and, in some traditional/unrefined varieties, erucic acid—a fatty acid restricted by some food regulators due to cardiac tissue lipidosis concerns observed in animal studies at high intake.", "Dosage (Typical)": "Seed: 1–3 g/day (culinary/traditional use, e.g., tempering in cooking); Mustard oil: culinary use per regional dietary patterns (erucic-acid-restricted varieties recommended); standardized supplement extracts are uncommon/not well-established", "Dosage Form": "Whole Seed, Powder, Oil (culinary), Paste/Plaster (topical traditional use), Tincture (less common)", "Timing": "Seed: as culinary spice with meals; Oil: as cooking medium; Topical plaster: short-duration application (traditional respiratory/muscular use)", "Time to Effect": "Acute digestive stimulant effect: 30–60 minutes (culinary use); Topical counter-irritant effect: 15–30 minutes; Long-term gut/immune benefits: not well-quantified in clinical trial literature", "Side Effects": "Skin irritation/burns with topical mustard plaster if left too long (well-documented traditional caution); GI irritation at high seed/oil doses; allergic reaction (mustard is a recognized major food allergen in several jurisdictions including the EU)", "Contraindications": "Known mustard allergy (mandatory allergen labeling in EU/many countries); active GI ulceration (pungent/irritant effect may aggravate); use of high-erucic-acid mustard oil in cardiovascular-compromised individuals (regulatory caution in some markets); broken/irritated skin (topical plaster use)", "Drug Interactions": "No major significant pharmaceutical drug interactions well-documented for dietary culinary use; theoretical mild interaction with anticoagulants at high supplemental doses (limited data); thyroid medications (cruciferous/glucosinolate-containing foods have a theoretical goitrogenic interaction at very high intake, though dietary culinary amounts are not typically a concern)", "Vendor 1": "Synthite Industries", "Vendor 1 Product details": "Mustard Seed Oil / Mustard Extract (Rai/Sarson, food grade)", "Vendor 1 Origin": "India", "Vendor 2": "Pusa/regional Indian agri-cooperatives", "Vendor 2  Product details": "Cold-Pressed Mustard Oil (Kachi Ghani, traditional)", "Vendor 2 Origin": "India (Punjab, Rajasthan, Bengal)", "Vendor 3": "Frontier Co-op", "Vendor 3 Product details": "Yellow/Brown Mustard Seed (whole, culinary grade)", "Vendor 3 Origin": "USA / Canada (sourced)", "FDA Status": "Mustard oil for EXTERNAL/topical use only is FDA-permitted in the US; internal/culinary use of mustard oil is NOT approved by FDA for sale as a cooking oil domestically due to erucic acid content concerns (though it is imported/sold in some ethnic markets labeled 'for external use only')", "EU Status": "EU regulates maximum erucic acid content in food oils (including mustard-derived oil) due to historical cardiac lipidosis findings in animal studies; mustard seed itself widely permitted as spice/condiment; mustard is a mandatory allergen label requirement in the EU", "India (FSSAI/AYUSH)": "FSSAI-permitted and widely consumed as a primary cooking oil (Kachi Ghani Sarson ka Tel) in North/East India; AYUSH recognizes mustard (Rai/Sarson) extensively for digestive, respiratory (steam inhalation), and topical (oil massage) traditional applications", "Market Applications": "Culinary spice & cooking oil (primary, especially Indian/Bengali/Punjabi cuisine); Traditional topical preparations (mustard plaster, oil massage); Digestive/condiment products; NOTE: 'heart health' claim requires regulatory-aware qualification given erucic acid restrictions in several jurisdictions", "_id": 209, "_sheet": "Ingredients"}, {"Name": "Pepper", "Also Known As": "Piper nigrum, Black Pepper, King of Spices, Kali Mirch, Piperine source", "Category": "Botanical / Spice-Medicinal Herb", "Sub-Category": "Bioavailability Enhancer / Metabolic & Digestive Spice", "Summary": "Piper nigrum (Black Pepper) is a flowering vine native to South India (Kerala/Malabar Coast), historically one of the most valuable traded spices globally ('King of Spices'). Its primary bioactive, piperine, is the most extensively studied bioavailability-enhancing compound in nutraceutical science (commercially trademarked as Bioperine®), with solid evidence supporting the user-stated blood glucose, immunity, and vitality/energy benefits through complementary mechanisms.", "Key Benefits": "Bioavailability enhancement (piperine increases absorption of curcumin, CoQ10, selenium, beta-carotene, and various drugs/nutrients—strongest, most-studied mechanism); Blood glucose regulation support; Immune modulation & antimicrobial activity; Digestive stimulation (classical Ayurvedic 'deepana-pachana' metabolic/digestive fire enhancer, tied to vitality); Antioxidant protection; Mild thermogenic effect", "Mechanism of Action": "Piperine inhibits CYP3A4 and P-glycoprotein in the gut and liver, dramatically slowing first-pass metabolism of co-administered compounds, increasing their bioavailability (the basis for Bioperine® combination products); modulates glucose transporter expression and improves insulin receptor sensitivity, supporting healthy blood glucose; activates TRPV1 receptors contributing to mild thermogenic and metabolic-stimulating effects (relevant to 'vitality' positioning); demonstrates immunomodulatory activity via macrophage and cytokine modulation; antimicrobial activity against several pathogens.", "Dosage (Typical)": "5–20 mg piperine/day (standardized extract, often as Bioperine®, typically combined with other nutrients); whole pepper: culinary use, 1–3 g/day", "Dosage Form": "Capsule, Tablet (often combined with curcumin/other actives), Powder, Whole/Ground Spice", "Timing": "With meals (culinary and supplement use); supplement piperine often co-formulated and co-dosed with the nutrient it's meant to enhance", "Time to Effect": "Acute digestive/metabolic effect: 30–60 minutes; Bioavailability enhancement: immediate (co-dose dependent); Blood glucose/immune benefits: 4–8 weeks of consistent use", "Side Effects": "GI/heartburn irritation at high doses; significantly increased absorption of co-administered drugs can be a double-edged safety consideration (risk of unintended drug-level increases)", "Contraindications": "Active peptic ulcer disease or GI inflammation (pungent/heating spice may aggravate at high supplemental doses); concurrent use with narrow-therapeutic-index medications (due to strong CYP3A4/P-glycoprotein inhibition increasing drug absorption); pregnancy (high-dose supplemental piperine, limited safety data; culinary use considered safe)", "Drug Interactions": "SIGNIFICANT: piperine markedly increases bioavailability/blood levels of numerous co-administered drugs (phenytoin, propranolol, theophylline, rifampicin, and others) via CYP3A4 and P-glycoprotein inhibition—this is both the primary therapeutic value (when intentionally combined with beneficial nutrients) and the primary safety caution (when inadvertently combined with prescription medications); requires careful disclosure on any product label", "Vendor 1": "Sabinsa Corporation", "Vendor 1 Product details": "Bioperine® (standardized 95% piperine)", "Vendor 1 Origin": "India", "Vendor 2": "Synthite Industries", "Vendor 2  Product details": "Black Pepper Oleoresin / Piperine Extract", "Vendor 2 Origin": "India (Kerala)", "Vendor 3": "Plant Lipids Pvt. Ltd.", "Vendor 3 Product details": "Piperine 95% (Piper nigrum Standardized Extract)", "Vendor 3 Origin": "India (Kerala)", "FDA Status": "Dietary supplement under DSHEA; Bioperine® widely recognized GRAS bioavailability-enhancing ingredient in numerous combination supplement products", "EU Status": "Permitted food/spice and supplement ingredient; piperine-containing bioavailability-enhancer blends widely sold across EU supplement market, especially curcumin combination products", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes black pepper (Maricha) as one of the three components of Trikatu, valued for digestive fire (Agni) enhancement closely linked to traditional 'vitality' concepts", "Market Applications": "Bioavailability-enhancer ingredient (paired with curcumin, CoQ10, other nutrients—largest commercial application); Blood sugar support formulas; Immune support blends; Energy/vitality supplements; Culinary spice (universal)", "_id": 210, "_sheet": "Ingredients"}, {"Name": "Phyllanthus", "Also Known As": "Phyllanthus niruri, Phyllanthus emblica (distinct, see note), Bhumi Amla, Stonebreaker, Chanca Piedra", "Category": "Botanical / Hepatoprotective Herb", "Sub-Category": "Liver & Gut Support Herb", "Summary": "Phyllanthus most commonly refers to Phyllanthus niruri (Bhumi Amla/Chanca Piedra), a small herbaceous plant native to India and tropical regions worldwide, traditionally used across Ayurveda and South American folk medicine ('stonebreaker') for liver health, kidney stones, and digestive complaints. Note: Phyllanthus is sometimes confused with the related but distinct Phyllanthus emblica (Amla/Indian Gooseberry)—this entry covers P. niruri as the more classically 'Phyllanthus'-branded ingredient, with the user-stated benefits reasonably aligned, particularly for the constipation/gut claim.", "Key Benefits": "Hepatoprotective / liver health support (primary, strongest evidence for P. niruri); Kidney stone prevention (traditional 'stonebreaker' use); Antiviral activity (notably hepatitis B research interest); Digestive regulation / mild laxative effect (supports constipation claim, secondary indication); Immune support (antioxidant, antiviral-linked); Blood sugar regulation (preliminary)", "Mechanism of Action": "Phyllanthin and hypophyllanthin (lignans) provide hepatoprotective activity by stabilizing liver cell membranes and reducing oxidative damage; demonstrated in vitro inhibition of hepatitis B viral DNA polymerase (basis for historical antiviral research interest); mild diuretic and antilithic (stone-preventing) action attributed to reduction of calcium oxalate crystal aggregation in kidneys; tannins and bitter compounds contribute to traditional digestive/mild-laxative use; antioxidant flavonoids support general immune-adjacent free-radical protection.", "Dosage (Typical)": "500–1000 mg standardized extract/day (whole plant or leaf extract); traditional decoction: 2–4 g dried herb/day", "Dosage Form": "Capsule, Tablet, Powder (Churna), Decoction/Tea, Liquid Extract", "Timing": "With meals, divided doses 2x/day; traditional use often as a decoction taken on empty stomach for kidney stone applications", "Time to Effect": "Digestive/mild laxative effect: 1–3 days; Liver support benefits: 4–8 weeks; Kidney stone-related effects: requires medical supervision and longer-term use", "Side Effects": "Generally well tolerated; mild GI upset, diarrhea (related to/consistent with its mild laxative action) at higher doses; rare allergic reaction", "Contraindications": "Pregnancy (traditionally used cautiously, antifertility effects noted in some animal studies at high doses); active kidney disease requiring medical management (use under supervision rather than self-treatment for kidney stones); concurrent diabetes medication (monitor for additive blood sugar effect)", "Drug Interactions": "Antidiabetic medications (theoretical additive hypoglycemic effect); antihypertensive medications (mild theoretical additive effect, limited data); lithium (theoretical altered excretion via diuretic-like action—limited data)", "Vendor 1": "Sami Labs / Sabinsa", "Vendor 1 Product details": "Phyllanthus niruri Standardized Extract", "Vendor 1 Origin": "India", "Vendor 2": "Himalaya Drug Company", "Vendor 2  Product details": "Liv.52 / Bhumi Amla-containing hepatoprotective formulations", "Vendor 2 Origin": "India", "Vendor 3": "Natural Remedies Pvt. Ltd.", "Vendor 3 Product details": "Phyllanthus niruri Whole Plant Extract", "Vendor 3 Origin": "India", "FDA Status": "Dietary supplement under DSHEA; no specific FDA-approved drug claim; research interest (especially historical hepatitis B studies) has not translated to an approved pharmaceutical indication", "EU Status": "Permitted food supplement; some EU herbal product registrations recognize traditional liver-support and digestive use; not specifically approved for kidney stone treatment as a registered medicinal claim", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Bhumi Amla (Phyllanthus niruri) for liver, kidney/urinary, and digestive applications; very widely used in Indian Ayurvedic liver-support formulations (e.g., as a component in Liv.52-type products)", "Market Applications": "Liver health / hepatoprotective supplements (primary, strongest market application); Kidney stone support products; Digestive regulation formulas (constipation, secondary use); Antiviral/immune research-oriented products; Ayurvedic combination liver formulas", "_id": 211, "_sheet": "Ingredients"}, {"Name": "Psyllium Husk", "Also Known As": "Plantago ovata, Ispaghula, Isabgol, Blond Psyllium, Psyllium Seed Husk", "Category": "Botanical / Dietary Fiber", "Sub-Category": "Soluble Fiber / Bulk-Forming Laxative", "Summary": "Psyllium Husk is derived from the seeds of Plantago ovata, a plant native to India, Pakistan, and the Mediterranean region, where India remains the world's largest producer and exporter (primarily from Gujarat). It is one of the most clinically validated soluble fiber supplements globally, with an FDA-approved health claim and extensive evidence for digestive, cholesterol, and blood sugar applications.", "Key Benefits": "Bowel regularity / constipation relief (bulk-forming laxative); Cholesterol reduction (LDL-lowering); Blood sugar regulation (slows glucose absorption); IBS symptom management; Weight management (satiety); Gut microbiome support (prebiotic-like fermentation)", "Mechanism of Action": "Forms a viscous gel upon contact with water (high soluble fiber content, primarily arabinoxylan); gel increases stool bulk and water content, stimulating peristalsis (bulk-forming laxative mechanism); binds bile acids in the intestine, increasing hepatic conversion of cholesterol to bile acids and lowering circulating LDL; slows gastric emptying and glucose absorption, blunting postprandial blood sugar spikes; partial fermentation by colonic bacteria produces short-chain fatty acids supporting gut health.", "Dosage (Typical)": "5–10 g/day (typically 1 tsp/5 g in water, 1–3x/day, up to 20–30 g/day for cholesterol-lowering protocols)", "Dosage Form": "Powder (most common), Capsule, Granules, Wafer", "Timing": "With meals or before meals (cholesterol/glucose effect); with large glass of water always; consistent daily timing for bowel regularity", "Time to Effect": "Bowel regularity: 12–72 hours; Cholesterol-lowering effect: 4–8 weeks of consistent use; Blood sugar effect: acute (with each dose)", "Side Effects": "Bloating, gas, abdominal cramping (especially when starting or with inadequate water intake); rare allergic reaction (occupational asthma/anaphylaxis reported in those with repeated powder inhalation exposure, e.g., healthcare workers)", "Contraindications": "Bowel obstruction or stricture (contraindicated—bulk-forming fiber can worsen obstruction); difficulty swallowing; esophageal narrowing; inadequate fluid intake situations (choking/blockage risk if not taken with sufficient water)", "Drug Interactions": "SIGNIFICANT: can reduce absorption of many oral medications if taken simultaneously (separate by at least 2 hours)—particularly relevant for lithium, carbamazepine, digoxin, and other narrow-therapeutic-index drugs; may enhance effect of antidiabetic medications (additive blood sugar lowering); may reduce absorption of fat-soluble vitamins with chronic high-dose use", "Vendor 1": "Procter & Gamble (Metamucil)", "Vendor 1 Product details": "Metamucil® (Psyllium Husk Powder, various flavors)", "Vendor 1 Origin": "USA (formulated) / India (sourced)", "Vendor 2": "Sat Isabgol", "Vendor 2  Product details": "Sat Isabgol Premium Psyllium Husk", "Vendor 2 Origin": "India (Gujarat)", "Vendor 3": "Organic India", "Vendor 3 Product details": "Organic Psyllium Husk Powder", "Vendor 3 Origin": "India", "FDA Status": "FDA-approved qualified health claim: psyllium soluble fiber may reduce risk of coronary heart disease (21 CFR 101.81); GRAS; OTC laxative monograph status", "EU Status": "EFSA-approved health claims: psyllium contributes to normal bowel function and to reduction of post-prandial glycaemic response when consumed with a meal; widely permitted food/supplement ingredient", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Isabgol as a classical Ayurvedic remedy for constipation and digestive regulation; India is the world's largest producer (Gujarat, especially Unjha market)", "Market Applications": "Digestive health / laxative supplements; Cholesterol management formulas; Blood sugar support products; Weight management (satiety/fiber); Gut health/prebiotic blends; OTC pharmacy fiber products", "_id": 212, "_sheet": "Ingredients"}, {"Name": "Pterocarpus marsupium Extract", "Also Known As": "Vijaysar, Indian Kino Tree, Malabar Kino, Bijasar, Asana, Pitasara", "Category": "Botanical / Antidiabetic Herb", "Sub-Category": "Hypoglycemic / Beta-Cell Protective Tree Bark Extract", "Summary": "Pterocarpus marsupium is a deciduous tree native to India, used extensively in classical Ayurveda (where it is called Vijaysar) as one of the most important traditional antidiabetic remedies. Its heartwood is traditionally used to prepare water stored in cups carved from the wood ('Vijaysar tumbler' water), and its bark/heartwood extract contains pterostilbene, epicatechin, and marsupin, with notable preclinical evidence for pancreatic beta-cell regeneration.", "Key Benefits": "Blood sugar regulation (antidiabetic); Pancreatic beta-cell protective/regenerative effect (preclinical); Antioxidant protection; Anti-inflammatory; Wound healing (traditional); Cholesterol management (preliminary)", "Mechanism of Action": "(-)-Epicatechin (a flavan-3-ol also found in this tree's bark) has been studied for its ability to promote pancreatic beta-cell regeneration and insulin secretion in preclinical models—a relatively unique mechanism among antidiabetic botanicals; pterostilbene (a resveratrol analog also present) activates PPAR-gamma and improves insulin sensitivity; marsupin and other flavonoids inhibit aldose reductase (relevant to diabetic complications) and alpha-glucosidase (slowing carbohydrate digestion).", "Dosage (Typical)": "2–4 g dried heartwood/bark powder/day (as decoction or via traditional Vijaysar water); standardized extract: 250–500 mg/day", "Dosage Form": "Powder, Decoction (traditional Vijaysar water/tumbler method), Capsule, Tablet, Standardized Extract", "Timing": "Traditional: water stored overnight in heartwood tumbler, consumed morning (empty stomach); extract: with or before meals, divided doses", "Time to Effect": "Acute blood sugar effect: variable, often noted within days to weeks of traditional use; Beta-cell/long-term metabolic benefits: 8–12 weeks or longer of consistent use", "Side Effects": "Generally well tolerated in traditional use; mild GI upset; limited modern safety/toxicology data compared to better-studied antidiabetic herbs", "Contraindications": "Pregnancy/breastfeeding (insufficient modern safety data); concurrent insulin or antidiabetic drug therapy (significant hypoglycemia risk—requires close glucose monitoring and likely dose adjustment); planned surgery (blood sugar fluctuation management concern)", "Drug Interactions": "SIGNIFICANT: antidiabetic medications and insulin (substantial additive hypoglycemic effect—well-documented concern requiring careful blood glucose monitoring and potential dose reduction of conventional medication under medical supervision)", "Vendor 1": "Himalaya Drug Company", "Vendor 1 Product details": "Vijaysar Tablets / Pterocarpus marsupium Extract (Diabecon component)", "Vendor 1 Origin": "India", "Vendor 2": "Baidyanath Ayurved", "Vendor 2  Product details": "Vijaysar Ghan Vati / Bark Powder", "Vendor 2 Origin": "India", "Vendor 3": "Natural Remedies Pvt. Ltd.", "Vendor 3 Product details": "Pterocarpus marsupium Standardized Bark Extract", "Vendor 3 Origin": "India", "FDA Status": "Not evaluated by FDA; no GRAS or NDI filing; dietary supplement under DSHEA where marketed in the US, primarily through Ayurvedic/specialty channels", "EU Status": "Not specifically listed in EU Novel Foods or supplement directives; very limited EU market presence; would require Novel Food authorization for broader EU market entry", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively and classically recognizes Vijaysar as one of the principal traditional Ayurvedic antidiabetic herbs (Madhumeha treatment), widely used in Ayurvedic pharmacies and formulations across India", "Market Applications": "Ayurvedic antidiabetic formulations (primary, e.g., component of Diabecon, D-Type tablets); Blood sugar management supplements; Traditional Vijaysar wood tumblers/cups (water-infusion method); Research interest in beta-cell regeneration", "_id": 213, "_sheet": "Ingredients"}, {"Name": "Saffron", "Also Known As": "Crocus sativus, Kesar, Zaffran, Red Gold, Saffron Stigma Extract, Safranal/Crocin source", "Category": "Botanical / Mood & Eye Health Herb", "Sub-Category": "Mood-Supportive / Antioxidant Spice Extract", "Summary": "Saffron is derived from the dried stigmas of Crocus sativus, a flowering plant primarily cultivated in Iran (over 90% of global supply), with significant production also in Kashmir (India), Spain, and Greece. It is the world's most expensive spice by weight due to extremely labor-intensive hand-harvesting, and has emerged as one of the more clinically validated botanicals for mood/depression support, alongside well-documented eye health and PMS applications.", "Key Benefits": "Mood support / mild-to-moderate depression relief; Premenstrual syndrome (PMS) symptom relief; Eye health (macular degeneration protection); Antioxidant protection; Appetite/satiety modulation (mild); Cognitive support (preliminary, Alzheimer's research)", "Mechanism of Action": "Crocin and crocetin (carotenoid pigments) and safranal (volatile aromatic compound) modulate serotonin reuptake inhibition (SSRI-like mechanism) and influence dopamine and NMDA receptor activity, contributing to antidepressant-like effects; crocin and crocetin provide potent antioxidant protection to retinal photoreceptors, supporting macular health; anti-inflammatory action via NF-κB and COX-2 inhibition; influences serotonin-related appetite regulation pathways.", "Dosage (Typical)": "30 mg standardized extract/day (most common clinical dose, often divided 15 mg 2x/day) for mood; 20–30 mg/day for PMS; eye health: 20–50 mg/day", "Dosage Form": "Capsule, Tablet, Tincture, Extract (standardized to crocin/safranal), Culinary Threads", "Timing": "Morning and evening (divided dose) for mood support; consistent daily timing recommended", "Time to Effect": "Acute mood effect: some studies note improvement within 1–2 weeks; Full antidepressant-comparable effect: 6–8 weeks; PMS benefits: across 1–2 menstrual cycles", "Side Effects": "Generally well tolerated at standard doses; mild GI upset, dry mouth, anxiety, headache, dizziness at higher doses; appetite changes", "Contraindications": "Pregnancy (high doses are traditionally avoided—uterine stimulant/abortifacient concern at doses well above culinary use, though culinary amounts are generally considered safe); bipolar disorder (theoretical mood-activating concern with antidepressant-like herbs); bleeding disorders (mild theoretical concern at high doses)", "Drug Interactions": "Antidepressants/SSRIs/MAOIs (theoretical additive serotonergic effect—caution, possible serotonin syndrome risk at high combined doses); antihypertensive medications (saffron has mild blood-pressure-lowering properties—monitor); anticoagulants (mild theoretical additive bleeding risk at high doses)", "Vendor 1": "Novin Saffron / Sargol", "Vendor 1 Product details": "Premium Grade Saffron Threads / affron® (standardized extract)", "Vendor 1 Origin": "Iran / Spain (affron® processing)", "Vendor 2": "Pharmactive Biotech (affron®)", "Vendor 2  Product details": "affron® Saffron Extract (standardized crocin/safranal, clinically studied)", "Vendor 2 Origin": "Spain", "Vendor 3": "Kashmir Saffron Cooperative", "Vendor 3 Product details": "Kashmiri Mongra Saffron (GI-tagged premium grade)", "Vendor 3 Origin": "India (Jammu & Kashmir)", "FDA Status": "Dietary supplement under DSHEA; GRAS for culinary spice use; affron® has self-affirmed GRAS status for the standardized extract", "EU Status": "Permitted food/spice and supplement ingredient; affron® and similar standardized extracts increasingly used in EU mood-support supplements; no specific EFSA health claim formally approved yet for mood", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Kesar (Saffron) for mood, skin, digestive, and Rasayana applications; Kashmir saffron carries GI (Geographical Indication) tag and is a premium Indian agricultural product", "Market Applications": "Mood support / mild depression supplements; PMS/women's health products; Eye health (macular support) formulas; Culinary spice (premium, especially Iranian and Kashmiri); Cognitive health research (preliminary)", "_id": 214, "_sheet": "Ingredients"}, {"Name": "Salacia", "Also Known As": "Salacia reticulata, Salacia oblonga, Salacia chinensis, Ponkoranti, Saptarangi, Kotala Himbutu (Sri Lanka)", "Category": "Botanical / Antidiabetic Herb", "Sub-Category": "Alpha-Glucosidase Inhibitor / Blood Sugar Management Herb", "Summary": "Salacia refers to a genus of woody vines native to India and Sri Lanka, traditionally used in Ayurvedic and Sri Lankan traditional medicine for centuries for diabetes management. Its root and stem bark contain salacinol, kotalanol, and mangiferin—unique thiosugar sulfonium compounds (salacinol, kotalanol) that are among the most potent natural alpha-glucosidase inhibitors identified, giving it a well-substantiated, mechanism-validated evidence base for postprandial blood sugar control.", "Key Benefits": "Postprandial blood sugar reduction (primary, strong evidence); Weight management support (secondary, via reduced carbohydrate absorption); Cholesterol/lipid management (preliminary); Antioxidant protection; Anti-inflammatory; Insulin sensitivity support", "Mechanism of Action": "Salacinol and kotalanol (unique sulfonium sulfate thiosugars found almost exclusively in this genus) competitively inhibit intestinal alpha-glucosidase enzymes (including sucrase and maltase) with potency comparable to the pharmaceutical drug acarbose, slowing carbohydrate breakdown and glucose absorption in the small intestine; mangiferin provides additional antioxidant and mild insulin-sensitizing activity via PPAR pathway modulation; reduced carbohydrate absorption secondarily supports modest weight management.", "Dosage (Typical)": "240–500 mg standardized root/bark extract/day, taken with carbohydrate-containing meals (often divided across meals)", "Dosage Form": "Capsule, Tablet, Powder, Standardized Extract (often combined with meals as a 'carb blocker')", "Timing": "Immediately before or with each carbohydrate-containing meal (mechanism is meal-timing-dependent, similar to acarbose)", "Time to Effect": "Acute postprandial glucose-blunting effect: within the same meal (30–60 minutes); Sustained metabolic benefits: 4–8 weeks of consistent meal-timed use", "Side Effects": "GI gas, bloating, mild diarrhea (mechanistically similar to acarbose—undigested carbohydrate reaching the colon causes fermentation-related GI effects); generally well tolerated otherwise", "Contraindications": "Concurrent use with other alpha-glucosidase inhibitor drugs (acarbose, miglitol—additive GI side effects and hypoglycemia risk); inflammatory bowel disease or significant GI disorders (may exacerbate GI symptoms); pregnancy/breastfeeding (insufficient modern safety data)", "Drug Interactions": "SIGNIFICANT: antidiabetic medications and insulin (additive hypoglycemic effect, particularly notable and well-documented with this herb given its potent alpha-glucosidase-inhibiting mechanism—requires blood glucose monitoring and likely medication dose adjustment under medical supervision); iron supplements (theoretical reduced absorption if taken simultaneously)", "Vendor 1": "Sami Labs / Sabinsa", "Vendor 1 Product details": "Salacia reticulata Standardized Extract", "Vendor 1 Origin": "India", "Vendor 2": "Pharmanza Herbal Pvt. Ltd.", "Vendor 2  Product details": "Salacia oblonga Root Bark Extract", "Vendor 2 Origin": "India (Gujarat)", "Vendor 3": "Arjuna Natural", "Vendor 3 Product details": "Salacia chinensis Standardized Extract (mangiferin/salacinol content)", "Vendor 3 Origin": "India (Kerala)", "FDA Status": "Dietary supplement under DSHEA; no specific FDA-approved drug claim; marketed primarily through specialty/Ayurvedic supplement channels in the US", "EU Status": "Not specifically listed in EU Novel Foods catalogue for all species; limited but growing EU specialty supplement market presence; would require Novel Food authorization review for some species/preparations", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH recognizes Salacia (Ponkoranti/Saptarangi) as a traditional Ayurvedic antidiabetic herb; well-established in Sri Lankan traditional medicine (Kotala Himbutu) as well, reflecting shared South Asian traditional use", "Market Applications": "Blood sugar management supplements (primary, 'carb blocker' positioning); Postprandial glucose support formulas; Weight management products (secondary); Ayurvedic antidiabetic formulations; Sports/metabolic nutrition (carbohydrate modulation)", "_id": 215, "_sheet": "Ingredients"}, {"Name": "Sesame Seed Extract", "Also Known As": "Sesamum indicum, Til, Gingelly, Benne Seed, Sesamin/Sesamol source", "Category": "Botanical / Functional Seed Extract", "Sub-Category": "Lignan-Rich Antioxidant Seed Extract", "Summary": "Sesame is one of the oldest cultivated oilseed crops, native to Africa and India, with India being among the world's largest producers and consumers (Til). Sesame seed and its extracted lignans (sesamin, sesamolin, sesamol) are increasingly studied for cardiovascular, antioxidant, and hormonal health applications, with sesamin in particular gaining nutraceutical popularity for cholesterol and blood pressure support.", "Key Benefits": "Cardiovascular health (cholesterol & blood pressure support); Antioxidant protection (lignans); Anti-inflammatory; Bone health (calcium/mineral-rich, traditional use); Skin & hair health (oil applications); Liver protective (preliminary); Menopausal symptom support (lignan/phytoestrogen-related, emerging)", "Mechanism of Action": "Sesamin (the primary lignan) inhibits delta-5-desaturase, modulating fatty acid metabolism and enhancing fat oxidation; demonstrated cholesterol-lowering activity via reduced hepatic cholesterol synthesis and increased excretion; sesamol provides potent direct antioxidant/free-radical scavenging activity; lignans have mild phytoestrogenic activity relevant to bone and menopausal applications; sesame is also naturally rich in calcium, magnesium, and zinc supporting traditional bone-health use.", "Dosage (Typical)": "200–600 mg sesamin-standardized extract/day; whole seed: 20–40 g/day (culinary/traditional use)", "Dosage Form": "Capsule, Tablet, Powder, Oil (culinary/topical), Whole/Hulled Seed, Tahini (food form)", "Timing": "With meals (fat-soluble lignans, absorption enhanced with dietary fat); divided doses for sustained levels", "Time to Effect": "Acute antioxidant effect: hours; Cholesterol/blood pressure benefits: 4–8 weeks of consistent use; Bone-related benefits: longer-term (months) of consistent dietary inclusion", "Side Effects": "Generally very well tolerated as food; allergic reaction is a significant concern—sesame is a recognized major food allergen (one of the top allergens requiring mandatory labeling in the US, EU, and other jurisdictions); mild GI upset at high extract doses", "Contraindications": "Known sesame allergy (potentially severe/anaphylactic reaction—mandatory allergen labeling required in most jurisdictions); hormone-sensitive conditions (theoretical mild phytoestrogenic concern at high concentrated extract doses); upcoming surgery (theoretical mild antiplatelet effect)", "Drug Interactions": "Antihypertensive medications (sesamin has mild blood-pressure-lowering activity—theoretical additive effect); anticoagulants/antiplatelets (mild theoretical additive effect at high extract doses, limited data); cholesterol-lowering medications (theoretical additive effect, generally considered complementary)", "Vendor 1": "Suntory Wellness (Sesamin-E)", "Vendor 1 Product details": "Sesamin-E® (standardized sesame lignan extract, branded)", "Vendor 1 Origin": "Japan", "Vendor 2": "Synthite Industries", "Vendor 2  Product details": "Sesame Seed Extract / Sesamol Standardized", "Vendor 2 Origin": "India", "Vendor 3": "Organic India", "Vendor 3 Product details": "Organic Sesame (Til) Seed / Oil", "Vendor 3 Origin": "India", "FDA Status": "Sesame is a recognized major food allergen requiring mandatory FDA labeling (added to the major allergen list under the FASTER Act, effective 2023); GRAS for food use; dietary supplement under DSHEA for extract forms", "EU Status": "Sesame is a mandatory allergen-labeling ingredient under EU food law (Annex II of Regulation 1169/2011); widely permitted as food and food supplement ingredient otherwise", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively recognizes Til (Sesame) for bone health, hair/skin (oil), and general Rasayana nutrition; one of the most culturally and culinarily significant oilseeds in India, especially in winter dietary traditions", "Market Applications": "Cardiovascular health supplements (sesamin-standardized); Antioxidant blends; Bone health formulas (traditional); Hair/skin care (oil-based cosmeceutical); Culinary oil & seed products; Women's health (menopausal lignan research, emerging)", "_id": 216, "_sheet": "Ingredients"}, {"Name": "Tomato", "Also Known As": "Solanum lycopersicum, Lycopersicon esculentum, Tomato Extract, Lycopene source", "Category": "Botanical / Functional Fruit-Vegetable", "Sub-Category": "Carotenoid (Lycopene)-Rich Functional Food Extract", "Summary": "Tomato (Solanum lycopersicum) is one of the most widely consumed fruits/vegetables globally, native to western South America and domesticated in Mexico, now a dietary staple worldwide. Beyond culinary use, tomato extract—particularly standardized for lycopene (the carotenoid responsible for its red color)—is among the most well-researched functional food ingredients for prostate, cardiovascular, and skin health, alongside a more recently validated platelet-function application (Fruitflow®).", "Key Benefits": "Prostate health support (lycopene, well-researched); Cardiovascular health (antioxidant, platelet function support); Antioxidant protection (lycopene has notably high singlet-oxygen quenching capacity); Skin photoprotection (UV-related oxidative damage); Eye health (preliminary); Platelet aggregation modulation (Fruitflow®, EFSA-approved claim)", "Mechanism of Action": "Lycopene is a potent carotenoid antioxidant with one of the highest singlet-oxygen quenching capacities of any dietary carotenoid, providing broad free-radical protection particularly relevant to prostate tissue (where it concentrates) and skin (UV-oxidative protection); inhibits LDL oxidation supporting cardiovascular health; modulates IGF-1 signaling and androgen receptor pathways relevant to prostate cell proliferation research; certain tomato-derived peptide/glycolipid fractions (Fruitflow®) inhibit ADP-induced platelet aggregation, a distinct mechanism from lycopene itself supporting cardiovascular/circulatory health.", "Dosage (Typical)": "10–30 mg lycopene/day (standardized extract); whole tomato/cooked tomato products: regular dietary inclusion (lycopene bioavailability enhanced by cooking and dietary fat)", "Dosage Form": "Capsule, Softgel, Tablet, Standardized Extract/Powder, Juice/Paste (dietary form)", "Timing": "With meals containing some dietary fat (fat-soluble carotenoid, absorption significantly enhanced by co-ingested fat and by cooking/processing)", "Time to Effect": "Acute antioxidant rise: hours after absorption; Prostate/cardiovascular benefits: 8–12 weeks or longer of consistent supplementation/dietary intake; Platelet function effect (Fruitflow®): within 3 hours of a single dose", "Side Effects": "Generally very well tolerated; rare GI upset; lycopenodermia (orange-ish skin discoloration) reported only with extremely high chronic intake, generally reversible and benign", "Contraindications": "No major absolute contraindications at typical dietary/supplemental doses; theoretical caution combining high-dose lycopene supplements with anticoagulant therapy (Fruitflow®-type extracts specifically affect platelet function)", "Drug Interactions": "Anticoagulants/antiplatelet medications (Fruitflow®-type tomato extracts specifically modulate platelet aggregation—theoretical additive effect worth monitoring, though generally considered to have a favorable safety profile even in combination); no other major significant interactions well-documented for standard lycopene supplementation", "Vendor 1": "LycoRed Ltd.", "Vendor 1 Product details": "Lyc-O-Mato® (whole tomato lycopene complex, standardized)", "Vendor 1 Origin": "Israel", "Vendor 2": "DSM Nutritional Products (Fruitflow®)", "Vendor 2  Product details": "Fruitflow® (Water-Soluble Tomato Concentrate, platelet-function specific)", "Vendor 2 Origin": "UK / Netherlands", "Vendor 3": "Synthite Industries", "Vendor 3 Product details": "Tomato Extract / Lycopene 5–10% (oil/powder)", "Vendor 3 Origin": "India", "FDA Status": "Lycopene is GRAS; Fruitflow® has FDA New Dietary Ingredient notification and is sold as a dietary supplement ingredient under DSHEA", "EU Status": "Fruitflow® holds an EFSA-approved Article 13.5 health claim ('helps maintain normal platelet aggregation, which contributes to healthy blood flow')—one of relatively few EU-approved specific health claims for a branded food ingredient; lycopene broadly permitted as food/supplement colorant and antioxidant ingredient", "India (FSSAI/AYUSH)": "FSSAI-permitted; tomato is a widely consumed staple vegetable across India; not a classical AYUSH herb (New World origin, introduced post-colonial era) but lycopene supplements are well-established in the Indian nutraceutical market, especially for men's health", "Market Applications": "Prostate health supplements (primary men's health application); Cardiovascular/platelet health products (Fruitflow®); Antioxidant/skin health blends; Eye health formulas; Functional food fortification (juices, sauces)", "_id": 217, "_sheet": "Ingredients"}, {"Name": "Tribulus terrestris", "Also Known As": "Gokshura, Puncture Vine, Caltrop, Goathead, Land Caltrop, Bindii", "Category": "Botanical / Vitality & Men's Health Herb", "Sub-Category": "Saponin-Rich Reproductive & Urinary Tonic Herb", "Summary": "Tribulus terrestris is a small leafy plant found across warm temperate and tropical regions worldwide including India, the Mediterranean, and Africa, with its spiny fruit giving rise to common names like 'puncture vine' and 'goathead.' Traditionally used in Ayurveda (Gokshura) for urinary, reproductive, and general vitality applications, it became globally popular as a testosterone-boosting bodybuilding supplement, though rigorous modern evidence does NOT support a direct testosterone-elevating effect in humans with normal testosterone levels—its better-supported applications are libido/sexual function and urinary tract health.", "Key Benefits": "Libido & sexual function support (most consistent modern evidence); Urinary tract health (traditional diuretic use); General vitality/adaptogen-like tonic effect (traditional); Mild antihypertensive (preliminary); NOTE: testosterone-boosting claim widely marketed but NOT well-supported by rigorous human trials in normal-testosterone populations", "Mechanism of Action": "Protodioscin (a steroidal saponin, the primary studied active compound) is theorized to convert to DHEA and influence the hypothalamic-pituitary-gonadal axis, though robust human evidence for actually raising serum testosterone is weak/inconsistent across rigorous trials; more consistent evidence points to a nitric-oxide-mediated effect on smooth muscle and vascular tissue relevant to sexual function/libido, independent of testosterone levels; diuretic and mild antihypertensive effects attributed to saponin content support traditional urinary tract use.", "Dosage (Typical)": "250–750 mg standardized extract/day (typically 40–60% saponins/protodioscin); traditional fruit/herb: 3–6 g/day", "Dosage Form": "Capsule, Tablet, Powder, Standardized Extract, Decoction (traditional)", "Timing": "Morning and/or before activity; divided doses 2–3x/day for sustained levels", "Time to Effect": "Libido/sexual function effects: 2–4 weeks of consistent use; Urinary/traditional tonic benefits: 2–4 weeks; (Testosterone-elevating effect: not reliably demonstrated regardless of duration in most rigorous human trials)", "Side Effects": "Generally well tolerated; mild GI upset, insomnia, mood changes at high doses; rare reports of gynecomastia (paradoxical, possibly related to contamination/adulteration in some commercial products rather than the herb itself)", "Contraindications": "Hormone-sensitive conditions (prostate cancer, certain reproductive cancers—theoretical caution given saponin/steroidal compound content, though direct hormonal activity in humans remains debated); pregnancy (traditionally avoided, uterine-stimulant theoretical concern); kidney stones (mixed evidence—some traditional diuretic use, but caution advised given limited modern safety data)", "Drug Interactions": "Antihypertensive medications (mild theoretical additive blood-pressure-lowering effect); diabetes medications (mild theoretical additive hypoglycemic effect, limited data); diuretics (theoretical additive effect given traditional diuretic use); lithium (theoretical altered excretion via diuretic-like action)", "Vendor 1": "Sami Labs / Sabinsa", "Vendor 1 Product details": "Tribusten® / Gokshura Standardized Extract (40% saponins)", "Vendor 1 Origin": "India", "Vendor 2": "Now Foods", "Vendor 2  Product details": "Tribulus Terrestris Extract (45% saponins)", "Vendor 2 Origin": "Bulgaria / India (sourced)", "Vendor 3": "Himalaya Drug Company", "Vendor 3 Product details": "Gokshura Tablets (classical Ayurvedic formulation)", "Vendor 3 Origin": "India", "FDA Status": "Dietary supplement under DSHEA; no FDA-approved drug claim; widely sold OTC particularly in sports nutrition/men's health categories despite weak testosterone evidence", "EU Status": "Permitted food supplement; widely sold across EU sports nutrition market; no EFSA-approved health claim (testosterone or otherwise) has been granted", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH extensively and classically recognizes Gokshura as an important Ayurvedic herb for urinary, reproductive, and Rasayana (vitality) applications—one of the more traditionally important 'Dashamoola' group-adjacent herbs", "Market Applications": "Men's vitality/libido supplements (primary commercial application, often marketed misleadingly as 'testosterone booster'); Sports nutrition/bodybuilding products; Urinary tract health formulas (traditional); Ayurvedic Rasayana/tonic formulations; Sexual health products (broader, not gender-specific)", "_id": 218, "_sheet": "Ingredients"}, {"Name": "Triphala", "Also Known As": "Triphala Churna, 'Three Fruits' (Amalaki/Amla, Bibhitaki, Haritaki), Phyllanthus emblica + Terminalia bellirica + Terminalia chebula combination", "Category": "Botanical / Classical Ayurvedic Formulation", "Sub-Category": "Polyherbal Digestive & Detoxification Formula", "Summary": "Triphala is one of the most renowned and widely used classical Ayurvedic formulations, a synergistic combination of three fruits in equal proportion: Amalaki (Phyllanthus emblica/Amla), Bibhitaki (Terminalia bellirica), and Haritaki (Terminalia chebula). Used for over a thousand years across Ayurvedic medicine, it is considered a foundational Rasayana (rejuvenative) formula with the most robust modern evidence specifically for digestive regularity, gut health, and mild laxative action, alongside emerging antioxidant and oral health research.", "Key Benefits": "Digestive regularity / mild laxative effect (primary, strongest evidence); Gut microbiome support (prebiotic-like, emerging research); Antioxidant protection (high Vitamin C content from Amalaki component); Oral health (antimicrobial, dental plaque reduction); Detoxification support (traditional Rasayana concept); Cholesterol/metabolic support (preliminary); Anti-inflammatory", "Mechanism of Action": "Combines tannins, gallic acid, and high Vitamin C (from Amalaki) providing potent antioxidant activity; anthraquinone-like and tannin compounds from Haritaki and Bibhitaki provide mild laxative/bowel-regulating action by stimulating peristalsis and softening stool without the harsh stimulant-laxative mechanism of some single-herb alternatives; gallic acid and ellagic acid derivatives demonstrate antimicrobial activity relevant to oral health (reducing cariogenic bacteria); polyphenols support modulation of gut microbiota composition (prebiotic-like fermentation).", "Dosage (Typical)": "1–6 g dried powder/day (typically taken as 3–5 g before bed with warm water); standardized extract: 500–1000 mg/day", "Dosage Form": "Powder (Churna, most traditional), Capsule, Tablet, Decoction/Tea, Liquid Extract", "Timing": "Traditionally taken at bedtime with warm water (for digestive/laxative effect) or first thing in morning on empty stomach; consistent daily timing recommended", "Time to Effect": "Mild laxative/digestive effect: 6–12 hours (typically next-morning bowel movement with bedtime dosing); Sustained gut health/antioxidant benefits: 4–8 weeks of consistent use", "Side Effects": "Mild GI cramping, loose stools/diarrhea (especially when starting or at higher doses—dose-dependent and generally an extension of the intended mild-laxative mechanism); rare allergic reaction", "Contraindications": "Pregnancy (traditionally avoided due to laxative/uterine-stimulant theoretical concern from component herbs); active diarrhea or IBS-D (laxative effect may worsen); severe dehydration risk situations; very young children (dose adjustment needed, generally avoided without practitioner guidance)", "Drug Interactions": "Diuretics (theoretical additive effect on fluid/electrolyte balance with chronic laxative use); iron supplements (tannin content may reduce iron absorption if taken simultaneously—separate dosing by 2 hours advised); antidiabetic medications (mild theoretical additive hypoglycemic effect, limited but accumulating evidence); other laxatives (additive effect—avoid combining)", "Vendor 1": "Himalaya Drug Company", "Vendor 1 Product details": "Triphala Tablets / Churna (classical Ayurvedic formulation)", "Vendor 1 Origin": "India", "Vendor 2": "Organic India", "Vendor 2  Product details": "Triphala Capsules (certified organic, classical 1:1:1 ratio)", "Vendor 2 Origin": "India", "Vendor 3": "Banyan Botanicals", "Vendor 3 Product details": "Organic Triphala Powder (traditional ratio)", "Vendor 3 Origin": "India / USA (formulated)", "FDA Status": "Dietary supplement under DSHEA; no FDA-approved drug claim; widely sold through mainstream and specialty/Ayurvedic supplement channels in the US", "EU Status": "Permitted food supplement; growing EU market presence particularly through Ayurvedic and natural health specialty channels; no specific EFSA health claim formally approved", "India (FSSAI/AYUSH)": "FSSAI-permitted; AYUSH considers Triphala one of the most important and extensively used classical Ayurvedic Rasayana formulations, prescribed across a very wide range of traditional indications including digestive, ocular, and general rejuvenative use", "Market Applications": "Digestive health / gentle laxative supplements (primary, strongest market and evidence alignment); Detox/cleanse products (traditional Rasayana positioning); Gut microbiome/prebiotic blends; Oral health products (mouth rinse/dental applications, emerging); General Ayurvedic welln gens": "Dairy-free, gluten-free, soy-free, nut-free per the brand; contains grass-derived ingredients (wheatgrass, barley grass) which may cross-react in people with grass-pollen allergies.", "Certifications": "DSHEA dietary supplement; FDA food supplement", "Target Consumer": "Health-conscious women 20–40; social media wellness community; busy mums", "Positioning": "flavor-forward greens powder aimed largely at women seeking an easy way to boost fruit/veg intake and reduce bloat — competes with AG1 and similar \"daily greens\" categories, differentiated mainly by its wide flavor range rather than ingredient depth", "Safety Notes": "High fiber/inulin content may cause GI upset if more than ~2 servings/day are consumed; not recommended during pregnancy/lactation without medical advice due to limited safety data on herbal adaptogen blends; probiotics may mildly interact with antibiotics — consult a provider if immunosuppressed", "_id": 548, "_sheet": "Branded products"}, {"Product Name": "Vital Proteins Collagen Peptides Advanced", "Brand / Company": "Vital Proteins (Nestlé)", "Country": "USA", "Product Type": "Collagen / Beauty Supplement", "Format": "Powder tub", "Price": "~$29.99–34.99 for a 20oz/27-serving tub", "Key Ingredients": "Bovine Collagen Peptides (20g), Vitamin C (90mg), Hyaluronic Acid (80mg), Biotin", "Benefits": "Hydrolyzed bovine collagen peptides (single primary ingredient) plus hyaluronic acid and vitamin C — marketed for skin, hair, nail, bone and joint support; 18 amino acids including glycine, proline, hydroxyproline; dissolves in hot or cold drinks", "Claims": "Collagen to support your hair, skin, nails, bones and joints; mixes into any beverage", "Allergens": "Sourced from bovine hide (not suitable for vegetarians/vegans); manufactured in a facility that also processes milk, fish, and tree nuts, so cross-contact is possible even though the product itself doesn't contain those as ingredients", "Certifications": "GRAS; DSHEA dietary supplement",
