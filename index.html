<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVP Index &mdash; Innovation Partnership Data Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IVP Index — design tokens
   Palette: ink #17231C, paper #F1EFE4, card manila #FBF9EF,
            clay #A8672B (Section 1 / IVP Database),
            pine #2F6F63 (Section 2 / Formats & Technologies)
   Type: Fraunces (display), IBM Plex Mono (data/labels), Source Sans 3 (body)
   Signature: records rendered as specimen / catalog index cards —
   punch-hole marker, tab edge colored by sheet, perforated fold on expand.
   ============================================================ */

:root{
  --ink:#17231C;
  --ink-soft:#455045;
  --paper:#F1EFE4;
  --card:#FBF9EF;
  --card-border:#DCD6C2;
  --clay:#A8672B;
  --clay-soft:#F3E3D2;
  --pine:#2F6F63;
  --pine-soft:#DCEAE6;
  --line:#D8D3C0;
  --shadow: 0 1px 2px rgba(23,35,28,0.06), 0 4px 14px rgba(23,35,28,0.05);
  --radius: 3px;
  --font-display:'Fraunces', serif;
  --font-mono:'IBM Plex Mono', monospace;
  --font-body:'Source Sans 3', sans-serif;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(23,35,28,0.055) 1px, transparent 0);
  background-size: 22px 22px;
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

a{ color:inherit; }

::selection{ background:var(--clay-soft); }

/* ---------- Topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:24px;
  padding:18px 28px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, #F7F5EB, var(--paper));
  flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
.brand-mark{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:13px;
  letter-spacing:0.08em;
  color:var(--paper);
  background:var(--ink);
  border-radius:50%;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
}
.brand-text h1{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:600;
  margin:0;
  line-height:1.1;
  letter-spacing:-0.01em;
}
.brand-text p{
  margin:2px 0 0;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:0.03em;
}

.searchwrap{
  position:relative;
  flex:1 1 380px;
  min-width:240px;
}
.search-icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--ink-soft); pointer-events:none;
}
#searchInput{
  width:100%;
  font-family:var(--font-body);
  font-size:15px;
  padding:12px 40px 12px 42px;
  border:1.5px solid var(--ink);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--ink);
  outline:none;
  transition:box-shadow .15s ease;
}
#searchInput:focus{ box-shadow:0 0 0 3px var(--clay-soft); }
#searchInput::placeholder{ color:#9a9481; }
.clear-btn{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:26px; height:26px;
  border:none; background:transparent; color:var(--ink-soft);
  font-size:20px; line-height:1; cursor:pointer; border-radius:50%;
  display:none;
}
.clear-btn.visible{ display:block; }
.clear-btn:hover{ background:var(--card-border); }

.result-tally{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--ink-soft);
  white-space:nowrap;
}
.result-tally strong{ color:var(--ink); }

/* ---------- Section switcher (two independent entry points) ---------- */
.section-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px 28px 0;
}
@media (max-width:640px){ .section-tabs{ grid-template-columns:1fr; } }

.section-btn{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  font-family:var(--font-display);
  font-size:17px;
  font-weight:600;
  text-align:left;
  padding:16px 20px;
  border-radius:var(--radius);
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .14s ease;
}
.section-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }
.section-btn-count{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:400;
  color:inherit;
  opacity:0.7;
  white-space:nowrap;
}
.section-btn[data-section="ivp-database"].active{
  background:var(--clay); border-color:var(--clay); color:#fff;
}
.section-btn[data-section="formats-tech"].active{
  background:var(--pine); border-color:var(--pine); color:#fff;
}
.section-btn:not(.active)[data-section="ivp-database"]:hover{ border-color:var(--clay); color:var(--clay); }
.section-btn:not(.active)[data-section="formats-tech"]:hover{ border-color:var(--pine); color:var(--pine); }

/* ---------- Sheet tabs (sub-navigation within the active section) ---------- */
.sheet-tabs{
  display:flex; gap:8px; flex-wrap:wrap;
  padding:14px 28px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,0.35);
}

.tab-btn{
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:0.02em;
  padding:8px 14px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .12s ease;
  white-space:nowrap;
}
.tab-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }
.tab-btn.active{
  background:var(--ink); color:var(--paper); border-color:var(--ink);
}
.tab-count{ opacity:0.65; margin-left:6px; }

/* ---------- Layout ---------- */
.layout{
  display:grid;
  grid-template-columns:270px 1fr;
  gap:0;
  align-items:start;
}
@media (max-width: 860px){
  .layout{ grid-template-columns:1fr; }
  .sidebar{ position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line); }
}

/* ---------- Sidebar filters ---------- */
.sidebar{
  border-right:1px solid var(--line);
  padding:20px 18px 60px;
  position:sticky;
  top:0;
  max-height:100vh;
  overflow-y:auto;
}
.sidebar-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.sidebar-head h2{
  font-family:var(--font-display);
  font-size:17px;
  margin:0;
}
.reset-btn{
  font-family:var(--font-mono);
  font-size:11px;
  background:none;
  border:1px solid var(--ink-soft);
  color:var(--ink-soft);
  padding:5px 10px;
  border-radius:20px;
  cursor:pointer;
}
.reset-btn:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

.filter-group{
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px dashed var(--card-border);
}
.filter-group:last-child{ border-bottom:none; }
.filter-group-title{
  font-family:var(--font-mono);
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--clay);
  margin:0 0 8px;
  font-weight:600;
}
.filter-tier-label{
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:#9a9481;
  margin:2px 0 10px;
  padding-bottom:6px;
  border-bottom:1px solid var(--card-border);
}
.filter-tier-label:not(:first-child){ margin-top:6px; }
.filter-col-title{
  font-size:13px;
  font-weight:600;
  margin:8px 0 6px;
  color:var(--ink);
}
.facet-option{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  padding:3px 0;
  cursor:pointer;
  color:var(--ink-soft);
}
.facet-option:hover{ color:var(--ink); }
.facet-option input{ accent-color:var(--clay); flex-shrink:0; }
.facet-label{ flex:1; line-height:1.25; }
.facet-count{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:#9a9481;
  flex-shrink:0;
}
.facet-more{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--pine);
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0 0;
  text-decoration:underline;
}
.no-filters{
  font-size:13px;
  color:var(--ink-soft);
  font-style:italic;
}

/* ---------- Results ---------- */
.results{ padding:22px 28px 80px; min-width:0; }
.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--ink-soft);
}
.empty-state p{ font-family:var(--font-display); font-size:18px; }

.card-list{ display:flex; flex-direction:column; gap:14px; }

/* ---------- Index card ---------- */
.rec-card{
  position:relative;
  background:var(--card);
  border:1px solid var(--card-border);
  border-left:5px solid var(--clay);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.rec-card[data-section="formats-tech"]{ border-left-color:var(--pine); }

.rec-card::before{ /* punch hole */
  content:"";
  position:absolute;
  top:16px; left:-8px;
  width:14px; height:14px;
  border-radius:50%;
  background:var(--paper);
  border:1px solid var(--card-border);
}

.rec-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding:16px 20px 14px 26px;
  cursor:pointer;
}
.rec-head:hover{ background:rgba(0,0,0,0.015); }

.rec-heading{ min-width:0; }
.rec-sheet-tag{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.07em;
  padding:2px 8px;
  border-radius:10px;
  background:var(--clay-soft);
  color:var(--clay);
  margin-bottom:6px;
}
.rec-card[data-section="formats-tech"] .rec-sheet-tag{ background:var(--pine-soft); color:var(--pine); }

.rec-title{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
  margin:0 0 4px;
  color:var(--ink);
  line-height:1.25;
}
.rec-preview{
  font-size:13.5px;
  color:var(--ink-soft);
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  max-width:70ch;
}
.rec-preview b{ color:var(--ink); font-weight:600; }

.rec-toggle{
  flex-shrink:0;
  width:30px; height:30px;
  border-radius:50%;
  border:1px solid var(--card-border);
  background:var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono);
  color:var(--ink);
  transition:transform .15s ease;
}
.rec-card.expanded .rec-toggle{ transform:rotate(45deg); }

.rec-body{
  border-top:1px dashed var(--card-border);
  padding:16px 20px 20px 26px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
  gap:14px 22px;
  background:repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(23,35,28,0.02) 28px);
}
.rec-field dt{
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--pine);
  margin:0 0 3px;
}
.rec-field dd{
  margin:0;
  font-size:13.5px;
  color:var(--ink);
  line-height:1.4;
  white-space:pre-line;
  word-break:break-word;
}
.rec-field dd a{ color:var(--clay); text-decoration:underline; }
.rec-field.span-2{ grid-column:span 2; }

@media (max-width:640px){
  .rec-body{ grid-template-columns:1fr; }
  .rec-field.span-2{ grid-column:span 1; }
  .topbar{ padding:16px; }
  .results{ padding:18px 16px 60px; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">IVP</span>
    <div class="brand-text">
      <h1>IVP Index</h1>
      <p>Innovation &amp; Partnership Data Tool</p>
    </div>
  </div>

  <div class="searchwrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35m1.35-5.15a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="Search across every sheet, every column&hellip;" autocomplete="off" spellcheck="false">
    <button id="clearSearch" class="clear-btn" title="Clear search" aria-label="Clear search">&times;</button>
  </div>

  <div class="result-tally" id="resultTally">&nbsp;</div>
</header>

<nav class="section-tabs" id="sectionTabs" aria-label="Sections"></nav>
<nav class="sheet-tabs" id="sheetTabs" aria-label="Sheets"></nav>

<main class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h2>Filters</h2>
      <button id="resetFilters" class="reset-btn">Reset all</button>
    </div>
    <div id="filterGroups" class="filter-groups"></div>
  </aside>

  <section class="results" id="results" aria-live="polite">
    <div class="empty-state" id="emptyState" hidden>
      <p>No records match your search and filters.</p>
      <button id="emptyReset" class="reset-btn">Clear search &amp; filters</button>
    </div>
    <div id="cardList" class="card-list"></div>
  </section>
</main>

ced via fermentation (Blakeslea trispora) or chemical synthesis, or extracted from sources like carrot/palm oil/algae (Dunaliella).", "Key Benefits": "Natural orange-yellow colouring for foods/beverages, serves as a safe vitamin A precursor (no hypervitaminosis A risk unlike preformed retinol), antioxidant activity.", "Mechanism of Action": "As a colourant, the conjugated polyene chain absorbs visible light to produce orange-yellow colour; nutritionally, beta-carotene is cleaved by intestinal/hepatic beta-carotene oxygenase to retinal/retinol, the body tightly regulating conversion rate (self-limiting, unlike preformed vitamin A).", "Dosage (Typical)": "Colourant use: per recipe/application (typically ppm-level); nutritional use: 3–6 mg/day (vitamin A equivalent dosing varies by formulation)", "Dosage Form": "Oil suspension, water-dispersible powder/beadlet, emulsion", "Timing": "With a fat-containing meal for nutritional (vitamin A precursor) absorption", "Time to Effect": "Immediate (colour); weeks for vitamin A status changes", "Side Effects": "Carotenodermia (orange-yellow skin tint) at high intakes — harmless and reversible; smokers taking isolated high-dose beta-carotene supplements (not food-colour levels) showed increased lung cancer risk in specific trials (CARET/ATBC studies)", "Contraindications": "High-dose ISOLATED supplemental beta-carotene contraindicated in current/former heavy smokers (per CARET/ATBC trial findings) — does not apply to food-colour-level use", "Drug Interactions": "None significant at colourant-level use; high-dose supplemental forms may interact with certain chemotherapy/retinoid regimens — verify if used at nutrient (not colour) dosing", "Vendor 1": "DSM-Firmenich", "Vendor 1 Product details": "Beta-Carotene (CWS/oil suspensions)", "Vendor 1 Origin": "Switzerland/Netherlands", "Vendor 2": "BASF", "Vendor 2  Product details": "Lucarotin Beta-Carotene", "Vendor 2 Origin": "Germany", "Vendor 3": "Allied Biotech / Indian carotenoid for rning re: premature infants, unrelated to general food use)", "Contraindications": "FDA has cautioned against using xanthan-gum-based thickeners in premature infant feeds due to reports of necrotizing enterocolitis-like complications — not relevant to standard adult food/supplement use", "Drug Interactions": "None clinically significant established at normal food-use levels", "Vendor 1": "CP Kelco", "Vendor 1 Product details": "Keltrol/Xanthan Gum", "Vendor 1 Origin": "USA/Global", "Vendor 2": "Cargill (formerly Deosen-affiliated supply)", "Vendor 2  Product details": "Xanthan Gum", "Vendor 2 Origin": "China/Global", "Vendor 3": "Vinayak Ingredients / Indian hydrocolloid distributors", "Vendor 3 Product details": "Xanthan Gum (food grade)", "Vendor 3 Origin": "India (import-distributed; primary manufacturing largely China/USA)", "FDA Status": "GRAS (21 CFR 172.695)", "EU Status": "Approved as E415 under Regulation (EC) No 1333/2008; ADI 'not specified'", "India (FSSAI/AYUSH)": "Permitted thickener/stabilizer (INS 415) under FSSAI Food Additive Regulations", "Market Applications": "Sauces/dressings, gluten-free baking, beverage suspension systems, supplement powder mouthfeel/suspension, dysphagia food-thickening products", "_id": 134, "_sheet": "Ingredients"}, {"Name": "Gum Arabic", "Also Known As": "Acacia Gum; INS 414; E414; Gum Acacia", "Category": "Food Additive", "Sub-Category": "Hydrocolloid / Emulsifier, Stabilizer & Soluble Fiber", "Summary": "Natural exudate gum harvested from Acacia senegal/Acacia seyal trees (predominantly Sub-Saharan 'Gum Belt' — Sudan, Chad, Nigeria); a complex arabinogalactan-protein polysaccharide used as an emulsifier, stabilizer, and increasingly recognized prebiotic soluble fiber.", "Key Benefits": "Excellent emulsification (especially for flavor oils/citrus oils in beverages), encapsulation/spray-drying carrier, low-viscosity soluble dietary fiber with prebiotic activity, supports gut microbiota diversity.", "Mechanism of Action": d pharma-grade traceability, food/beverage acidulant use", "_id": 137, "_sheet": "Ingredients"}, {"Name": "Maltitol", "Also Known As": "Maltitol Syrup (liquid form); E965; INS 965; Hydrogenated Maltose", "Category": "Sweetener", "Sub-Category": "Sugar Alcohol / Bulk Sweetener (Reduced-Calorie)", "Summary": "A disaccharide polyol produced by hydrogenation of maltose (derived from starch, typically corn or wheat), providing approximately 75-90% of sucrose's sweetness with about half the calories; widely used in sugar-free confectionery and as a bulk sweetener/bulking agent.", "Key Benefits": "Reduced-calorie sugar replacement with sucrose-like taste and bulk/texture (better mouthfeel match to sugar than many other polyols), does not promote dental caries, moderate glycemic impact (lower than sucrose but higher than erythritol).", "Mechanism of Action": "As a sugar alcohol, maltitol is incompletely absorbed in the small intestine; the unabsorbed fraction reaches the colon where it is fermented by gut bacteria, producing gas and short-chain fatty acids — this incomplete absorption is the basis for both its reduced caloric value and its laxative/GI side-effect profile at higher doses (more pronounced than erythritol, less than some other polyols).", "Dosage (Typical)": "No formal ADI established by JECFA, but manufacturers commonly note GI tolerance thresholds around 20-30 g/day for sensitive individuals (varies significantly by person)", "Dosage Form": "Crystalline powder, liquid syrup (maltitol syrup, common in sugar-free confectionery)", "Timing": "N/A (food ingredient)", "Time to Effect": "Immediate (sweetness); GI effects may occur within hours of high-dose consumption", "Side Effects": "Notable laxative effect, gas, and bloating at moderate-to-high doses (maltitol has one of the more pronounced GI tolerance issues among common polyols, generally worse than erythritol but comparable to or slightly better than sorbitol)", "Contraindications": "IBS/sensitive GI conditions — maltitol is high on the FODMAP scale and commonly recommended for avoidance/limitation in low-FODMAP diets", "Drug Interactions": "None clinically significant established", "Vendor 1": "Roquette", "Vendor 1 Product details": "Maltitol (Sweetpearl) / Maltitol Syrup (Lycasin)", "Vendor 1 Origin": "France", "Vendor 2": "Cargill", "Vendor 2  Product details": "C*MaltidexT Maltitol", "Vendor 2 Origin": "USA/Global", "Vendor 3": "Sanwa Starch / Towa Chemical (Asian maltitol producers)", "Vendor 3 Product details": "Maltitol Powder/Syrup (food grade)", "Vendor 3 Origin": "Japan/China — verify current FSSAI-compliant import documentation for Indian use", "FDA Status": "GRAS (food ingredient)", "EU Status": "Approved as E965 under Regulation (EC) No 1333/2008; EU labeling requires the statutory laxative-effect warning ('excessive consumption may produce laxative effects') above a defined threshold", "India (FSSAI/AYUSH)": "Permitted sweetener (INS 965) under FSSAI regulations for sugar-free/low-calorie product categories", "Market Applications": "Sugar-free chocolate and confectionery, baked goods, chewing gum, pharmaceutical tablet/syrup excipient", "_id": 138, "_sheet": "Ingredients"}, {"Name": "Sodium CMC", "Also Known As": "Sodium Carboxymethyl Cellulose; Cellulose Gum; INS 466; E466", "Category": "Food Additive", "Sub-Category": "Hydrocolloid / Thickener, Stabilizer & Emulsifier", "Summary": "A water-soluble cellulose derivative produced by chemically modifying cellulose (from wood pulp or cotton) with chloroacetic acid, widely used as a thickener, stabilizer, and water-binding agent across food, pharmaceutical, and personal care applications.", "Key Benefits": "Excellent water-binding and viscosity control, improves mouthfeel/texture in low-fat formulations, prevents ice-crystal formation in frozen desserts, stabilizes emulsions and suspensions, film-forming for coatings.", "Mechanism of Action": "The carboxymethyl substitution on the cellulose backbone makes it ht Management / Visceral Fat-Targeted Probiotic", "Summary": "A Lactobacillus species naturally found in the human gut and breast milk, with specific strains (notably SBT2055 from Megmilk Snow Brand, Japan, and BNR17) carrying the strongest published clinical evidence among probiotics for visceral fat reduction.", "Key Benefits": "Reduces abdominal visceral and subcutaneous fat area, supports modest reductions in body weight/BMI/waist-hip circumference, general digestive/gut-microbiota support, some evidence for anti-inflammatory and antiviral (influenza) activity in specific strains.", "Mechanism of Action": "SBT2055-specific research shows the strain slows the breakdown of dietary fat emulsion droplets by reducing droplet surface area available to pancreatic lipase, thereby suppressing intestinal fat absorption and promoting fecal fat excretion — a mechanism distinct from typical gut-microbiota-modulation explanations for other probiotic weight-management strains.", "Dosage (Typical)": "1-100 billion CFU/day depending on strain and study (SBT2055 clinical trials used 1-100 billion CFU/day over 12 weeks via fermented milk; capsule products often standardize to 10-20 billion CFU/day)", "Dosage Form": "Capsule (often gastro-resistant/delayed-release), fermented milk/yogurt (original clinical delivery format), powder", "Timing": "With meals, consistent daily dosing", "Time to Effect": "12 weeks in the primary clinical trials for visceral fat reduction (4.6% visceral fat area reduction, 3.3% subcutaneous fat reduction in the landmark SBT2055 study)", "Side Effects": "Generally well tolerated; mild GI effects (gas, bloating) possible during initial use, as with most probiotics", "Contraindications": "Immunocompromised individuals — general live-probiotic caution; no major contraindication established otherwise", "Drug Interactions": "None clinically significant established", "Vendor 1": "Megmilk Snow Brand Co., Ltd.", "Vendor 1 Product details": "Lactobacillus gasseri SBT2055 (proprietary, strongest clinical dossier)", "Vendor 1 Origin": "Japan", "Vendor 2": "SuperSmart / general L. gasseri capsule formulators", "Vendor 2  Product details": "Lactobacillus Gasseri (delayed-release capsule format)", "Vendor 2 Origin": "USA (manufacturing) — verify exact strain ID sourced", "Vendor 3": "BNR17 strain licensors (Korean strain originator institutions/companies)", "Vendor 3 Product details": "Lactobacillus gasseri BNR17", "Vendor 3 Origin": "South Korea", "FDA Status": "Generally regarded as safe within the broader Lactobacillus GRAS framework; specific strain (SBT2055) has not been the subject of a US FDA health claim authorization", "EU Status": "Permitted as a food supplement probiotic strain; no authorized EFSA-approved specific health claim for visceral fat reduction at this time", "India (FSSAI/AYUSH)": "Lactobacillus gasseri as a species is broadly consistent with FSSAI's permitted probiotic genus/species list for health supplements — verify specific strain (SBT2055/BNR17) registration status before formulation", "Market Applications": "Weight management/visceral fat-targeted probiotic supplements, functional fermented dairy products, digestive health supplements", "_id": 140, "_sheet": "Ingredients"}, {"Name": "Garcinia Cambogia", "Also Known As": "Malabar Tamarind; Garcinia gummi-gutta; HCA Extract; Hydroxycitric Acid Extract", "Category": "Botanical Extract", "Sub-Category": "Weight Management Botanical (Fat Metabolism)", "Summary": "Extract from the fruit rind of Garcinia cambogia (native to India and Southeast Asia), standardized to its key active compound hydroxycitric acid (HCA), historically among the most popular weight-management botanicals though clinical evidence for meaningful weight-loss efficacy remains modest/mixed.", "Key Benefits": "Traditionally marketed for appetite suppression and inhibition of fat storage (lipogenesis); some clinical evidence for modest short-term reductions in food intake and body weight, though effect sizes in rigorous trials are generally small.", "Mechanism of Action": "HCA is proposed to inhibit ATP-citrate lyase, an enzyme involved in converting excess dietary carbohydrate into fatty acids (lipogenesis), and may increase serotonin availability (contributing to appetite suppression) — though the magnitude of these effects in humans at typical supplement doses is debated in the literature.", "Dosage (Typical)": "500-1500 mg/day of extract standardized to 50-60% HCA, typically divided into 2-3 doses 30-60 minutes before meals", "Dosage Form": "Capsule, tablet, powder, often combined with chromium picolinate in commercial weight-management blends", "Timing": "30-60 minutes before meals", "Time to Effect": "Clinical trials typically run 8-12 weeks to detect modest weight/appetite effects", "Side Effects": "Generally well tolerated at typical doses; GI upset, headache, dizziness reported in some trials; rare but serious case reports of hepatotoxicity (liver injury) have been associated with some Garcinia/HCA-containing weight-loss products (causality debated, possibly linked to combination products or contamination rather than HCA itself)", "Contraindications": "Pre-existing liver disease (given hepatotoxicity case reports — even if causality is debated, conservative caution is warranted); pregnancy and lactation (insufficient safety data); diabetes (potential interaction with glucose-lowering effects)", "Drug Interactions": "Potential interaction with antidiabetic medications (theoretical additive glucose-lowering effect); caution with statins and other hepatically metabolized drugs given the hepatotoxicity signal in some case reports — recommend liver function monitoring for prolonged/high-dose combination use", "Vendor 1": "Botanic Healthcare", "Vendor 1 Product details": "Garcinia Cambogia Extract (standardized HCA)", "Vendor 1 Origin": "India", "Vendor 2": "Sarv Biolabs", "Vendor 2  Product details": "Garcinia Cambogia Extract (50-60% HCA)", "Vendor 2 Origin": "India", "Vendor 3": "InterHealth Nutraceuticals", "Vendor 3 Product details": "Super CitriMax (calcium/potassium-bound HCA, patented for improved bioavailability)", "Vendor 3 Origin": "USA", "FDA Status": "Dietary ingredient marketed under DSHEA; FDA issued a 2017 report flagging undeclared synthetic ingredients found in some Garcinia/weight-loss products during market surveillance — underscoring the importance of vendor quality verification", "EU Status": "Permitted botanical food supplement ingredient; no authorized EFSA weight-management health claim", "India (FSSAI/AYUSH)": "Native Indian botanical (also known regionally); permitted nutraceutical extract ingredient under FSSAI regulations", "Market Applications": "Weight management/appetite-control supplements, often combined with chromium picolinate, green coffee, or green tea extract in commercial fat-burner blends", "_id": 141, "_sheet": "Ingredients"}, {"Name": "L-Carnitine", "Also Known As": "L-Carnitine Tartrate/Fumarate (common supplement salts); Levocarnitine", "Category": "Amino Acid Derivative", "Sub-Category": "Energy Metabolism / Fat Transport Cofactor", "Summary": "A naturally occurring compound synthesized in the body from the amino acids lysine and methionine (and obtained from diet, primarily red meat), essential for transporting long-chain fatty acids into mitochondria for beta-oxidation (energy production); widely marketed for exercise performance, fat metabolism, and recovery.", "Key Benefits": "Supports fatty-acid transport into mitochondria for energy production, may reduce exercise-induced muscle damage/soreness and improve recovery, supports cognitive function in some populations (e.g., aging, hepatic encephalopathy as a prescription form), cardiovascular metabolic support in deficiency states.", "Mechanism of Action": "Carnitine shuttles long-chain fatty acyl groups across the inner mitochondrial membrane via the carnitine-acylcarnitine translocase system (carnitine palmitoyltransferase I/II), enabling beta-oxidation; in supplement form, it does not appear to significantly increase muscle carnitine content acutely in carnitine-sufficient individuals, limiting fat-oxidation-enhancement effects to specific populations or chronic/high-dose protocols with insulin co-administration.", "Dosage (Typical)": "500 mg-2 g/day (L-carnitine tartrate commonly used in sports nutrition; doses up to 2-4 g studied in some research, though absorption efficiency declines at higher single doses)", "Dosage Form": "Capsule, tablet, powder, liquid", "Timing": "Often taken with carbohydrate/insulin-stimulating meals (insulin appears to enhance muscle carnitine uptake in research) or pre/post-exercise", "Time to Effect": "Weeks to months for measurable muscle carnitine content changes (oral bioavailability is relatively low, ~15-20%, and saturates quickly)", "Side Effects": "Generally well tolerated; GI upset (nausea, cramping, diarrhea) at higher doses, fishy body odor (due to trimethylamine metabolite) in some individuals", "Contraindications": "Hypothyroidism (some evidence carnitine can interfere with thyroid hormone action — caution in hypothyroid patients); seizure disorder history (rare case reports of seizure exacerbation)", "Drug Interactions": "May interact with thyroid hormone replacement (theoretical antagonism); potential interaction with anticoagulants (warfarin) — some evidence of mild effect on clotting parameters, monitor if combined", "Vendor 1": "Lonza (Carnipure)", "Vendor 1 Product details": "Carnipure L-Carnitine (Tartrate/Base) — globally recognized branded/quality-verified ingredient", "Vendor 1 Origin": "Switzerland", "Vendor 2": "Sigma-Aldrich/Merck KGaA", "Vendor 2  Product details": "L-Carnitine (pharma/research grade)", "Vendor 2 Origin": "Germany", "Vendor 3": "Indian nutraceutical-grade L-carnitine importers/distributors (Lonza-licensed or generic Chinese-sourced)", "Vendor 3 Product details": "L-Carnitine Tartrate (sports nutrition grade)", "Vendor 3 Origin": "India (import-distributed, primary synthesis largely China/Europe) — verify Carnipure licensing vs. generic source on COA", "FDA Status": "GRAS as a dietary ingredient; also available as an FDA-approved prescription drug (Carnitor) for primary/secondary carnitine deficiency", "EU Status": "Permitted food supplement ingredient; EFSA has issued opinions on specific carnitine health claims (mixed/limited approval status — verify current claim wording permitted)", "India (FSSAI/AYUSH)": "Permitted nutraceutical amino-acid-derivative ingredient under FSSAI Health Supplement Regulations", "Market Applications": "Sports nutrition/fat-metabolism supplements, weight-management stacks, cardiovascular and recovery-support formulations", "_id": 142, "_sheet": "Ingredients"}, {"Name": "Chromium Picolinate", "Also Known As": "Chromium(III) Picolinate; Cr-Picolinate", "Category": "Mineral (Trace Element Chelate)", "Sub-Category": "Glucose/Insulin Metabolism Support Mineral", "Summary": "A trivalent chromium chelate bound to picolinic acid, the most bioavailable and widely studied supplemental form of chromium, an essential trace mineral involved in carbohydrate and lipid metabolism; frequently combined with Garcinia cambogia and other ingredients in weight-management formulations.", "Key Benefits": "Supports normal carbohydrate, fat, and protein metabolism, may improve insulin sensitivity and glycemic control modestly in some populations (particularly those with chromium insufficiency or type 2 diabetes), commonly marketed for appetite/craving control.", "Mechanism of Action": "Chromium is proposed to potentiate insulin action by facilitating insulin receptor binding and downstream signaling (via the chromodulin/low-molecular-weight chromium-binding substance pathway), enhancing glucose uptake into cells — though the magnitude of this effect in chromium-sufficient, non-diabetic individuals is generally modest.", "Dosage (Typical)": "200-1000 mcg/day elemental chromium (most commonly 200-600 mcg/day in commercial supplements)", "Dosage Form": "Capsule, tablet, often combined with other weight-management ingredients", "Timing": "With meals", "Time to Effect": "8-16 weeks for measurable glycemic/insulin sensitivity changes in clinical studies, where effects are observed", "Side Effects": "Generally well tolerated at typical doses; rare reports of GI upset, headache; case reports of renal/hepatic effects exist at very high doses far exceeding typical supplemental intake (causality debated)", "Contraindications": "Pre-existing renal impairment (theoretical caution given rare high-dose case reports); caution in patients on insulin/antidiabetic medications due to additive hypoglycemia potential", "Drug Interactions": "May potentiate the glucose-lowering effect of insulin and oral antidiabetic medications (sulfonylureas, metformin) — monitor blood glucose if combined; theoretical interaction with levothyroxine (reduced absorption if taken simultaneously — space dosing)", "Vendor 1": "Nutrition 21 (Chromax)", "Vendor 1 Product details": "Chromax Chromium Picolinate — the most clinically studied branded form", "Vendor 1 Origin": "USA", "Vendor 2": "Balchem Corporation", "Vendor 2  Product details": "Chromium Picolinate (food/pharma grade)", "Vendor 2 Origin": "USA", "Vendor 3": "Indian nutraceutical mineral-chelate distributors", "Vendor 3 Product details": "Chromium Picolinate (generic/Chromax-licensed)", "Vendor 3 Origin": "India — verify Chromax licensing vs. generic source", "FDA Status": "GRAS as a dietary mineral supplement ingredient", "EU Status": "Permitted food supplement mineral source; EFSA has authorized a specific health claim for chromium's contribution to normal macronutrient metabolism and maintenance of normal blood glucose levels (subject to specific conditions of use)", "India (FSSAI/AYUSH)": "Permitted trace mineral ingredient under FSSAI Health Supplement Regulations", "Market Applications": "Weight-management/glycemic-support supplements (frequently combined with Garcinia cambogia, as seen across multiple commercial products), diabetic-adjunct formulations", "_id": 143, "_sheet": "Ingredients"}, {"Name": "Soya Protein Isolate GS5100D", "Also Known As": "Isolated Soy Protein GS5100D; ISP GS5100D (Gushen brand)", "Category": "Protein Ingredient", "Sub-Category": "Functional Soy Protein Isolate (Emulsifying Grade)", "Summary": "A specific branded grade (GS5100D) of isolated soy protein manufactured by Gushen Biological Technology Group (Shandong, China), a non-GMO, light-yellow, non-dusty powder with >90% crude protein content, specifically engineered for emulsification performance in processed meat, fish, and frozen food applications (distinct from sports-nutrition-grade soy protein isolates).", "Key Benefits": "High protein content (>90% crude protein) functioning primarily as a food-technology emulsifier/binder/texturizer rather than a direct-consumption protein supplement; absorbs water efficiently, increases product yield, and improves texture in processed/emulsified food matrices.", "Mechanism of Action": "As a functional food ingredient, GS5100D's amphiphilic soy protein structure stabilizes oil-in-water emulsions in processed meat/fish/frozen products by reducing interfacial tension and forming a protective protein film around fat droplets, while its water-binding capacity improves yield and texture; nutritionally, it provides a complete (if soy-allergen-relevant) plant protein source when consumed.", "Dosage (Typical)": "Formulation-dependent (typically 1-3% inclusion rate in emulsified meat/fish products as a functional ingredient) — not typically dosed as a standalone consumer supplement at this specific grade", "Dosage Form": "Light-yellow, non-dusty powder, >97% passing 100 mesh particle size specification", "Timing": "N/A (food-processing functional ingredient)", "Time to Effect": "Immediate (functional/technological effect in food matrix)", "Side Effects": "Soy allergy is the primary concern (mandatory allergen labeling required); otherwise well tolerated as a food protein ingredient", "Contraindications": "Soy allergy (absolute contraindication); some caution historically suggested (though evidence is mixed/reassuring) regarding soy isoflavone phytoestrogen content in hormone-sensitive conditions", "Drug Interactions": "Soy protein/isoflavones may modestly affect thyroid hormone absorption if consumed close to levothyroxine dosing — space administration by several hours as a precaution; otherwise no significant interactions established", "Vendor 1": "Gushen Biological Technology Group Co., Ltd.", "Vendor 1 Product details": "GS 5100D Isolated Soy Protein (originator)", "Vendor 1 Origin": "Shandong Province, China", "Vendor 2": "Parchem (distributor)", "Vendor 2  Product details": "Gushen Soy Protein GS5100", "Vendor 2 Origin": "USA distribution of Chinese-manufactured material", "Vendor 3": "KP Manish Global Ingredients", "Vendor 3 Product details": "Gushen Soy Protein Isolate (Indian distribution)", "Vendor 3 Origin": "India (import-distributed from Gushen, China)", "FDA Status": "GRAS as a food protein ingredient", "EU Status": "Permitted food ingredient; mandatory soy allergen labeling applies", "India (FSSAI/AYUSH)": "Permitted protein/functional food ingredient under FSSAI regulations; mandatory soy allergen declaration required on labels", "Market Applications": "Emulsified sausages and processed meat products, fish/seafood-based food products (surimi, fish balls), frozen food formulations — primarily a food-technology functional ingredient rather than a sports-nutrition protein powder", "_id": 144, "_sheet": "Ingredients"}, {"Name": "Brown Rice Protein Isolate", "Also Known As": "Oryzatein; Rice Protein Isolate; Brown Rice Protein Concentrate", "Category": "Protein Ingredient", "Sub-Category": "Plant Protein (Hypoallergenic / Vegan)", "Summary": "A plant-based protein isolate derived from brown rice via enzymatic hydrolysis of rice flour/bran, valued as a hypoallergenic, allergen-friendly (free of the 'Big 8' major allergens including soy, dairy, gluten, and egg) alternative protein source for vegan and allergen-sensitive consumers.", "Key Benefits": "Hypoallergenic plant protein source (avoids soy, dairy, gluten, egg allergens), supports muscle protein synthesis (though with a lower leucine content than whey/soy, generally requiring a higher dose or blending with other plant proteins for equivalent anabolic effect), easily digestible, suitable for vegan formulations.", "Mechanism of Action": "Provides essential and non-essential amino acids that support muscle protein synthesis via mTOR pathway activation, though rice protein alone is relatively low in lysine, making it nutritionally complementary with pea or other legume proteins (which are comparatively low in methionine) for a complete amino acid profile in blended formulations.", "Dosage (Typical)": "20-30 g/day (typical single serving, similar to other protein powders), often slightly higher than whey-equivalent doses to compensate for lower leucine/lysine content", "Dosage Form": "Powder (used standalone or blended with pea/other plant proteins in commercial vegan protein products)", "Timing": "Post-exercise or as a general dietary protein supplement, any time of day", "Time to Effect": "Weeks for measurable muscle protein synthesis/strength outcomes (similar timeframe to other protein supplements with consistent training)", "Side Effects": "Generally very well tolerated; minimal GI effects compared to some plant proteins (e.g., pea protein can cause more bloating in some individuals)", "Contraindications": "Rice allergy (rare but documented); no other significant contraindications", "Drug Interactions": "None clinically significant established", "Vendor 1": "Axiom Foods", "Vendor 1 Product details": "Oryzatein (branded, widely licensed brown rice protein isolate)", "Vendor 1 Origin": "USA (sourcing processing partly in Asia)", "Vendor 2": "Shaanxi Hongda Phytochemistry / Chinese rice protein manufacturers", "Vendor 2  Product details": "Brown Rice Protein Isolate (generic, 80% protein grade)", "Vendor 2 Origin": "China", "Vendor 3": "Indian rice-protein distributors (verify current GMP-certified options)", "Vendor 3 Product details": "Brown Rice Protein Isolate (food/nutraceutical grade)", "Vendor 3 Origin": "India — confirm specific manufacturer, as India is a major rice producer but branded isolate-grade processing capacity should be verified per vendor", "FDA Status": "GRAS as a food protein ingredient", "EU Status": "Permitted food protein ingredient", "India (FSSAI/AYUSH)": "Permitted protein ingredient under FSSAI regulations; India's status as a major global rice producer is relevant for raw-material sourcing, though isolate-grade (enzymatically processed, high-purity) manufacturing capacity is concentrated more in specialized facilities (notably licensed Oryzatein producers and Chinese manufacturers) than broadly across Indian rice processors", "Market Applications": "Vegan/plant-based protein powders (often blended with pea protein for complete amino acid profile), allergen-friendly sports nutrition, infant/clinical hypoallergenic nutrition formulations", "_id": 145, "_sheet": "Ingredients"}, {"Name": "Novo G", "Also Known As": "Glucoamylase; Amyloglucosidase (AMG); Novozymes/Novonesis Glucoamylase Enzyme Product", "Category": "Food Processing Enzyme", "Sub-Category": "Starch Saccharification Enzyme", "Summary": "A glucoamylase (amyloglucosidase) enzyme preparation — based on the naming convention, likely part of the Novozymes/Novonesis legacy 'Novo'-prefixed enzyme product line (the company's predecessor Novo Nordisk/Novo Industri originated this naming pattern) — used industrially to hydrolyze starch/dextrins into glucose for baking, brewing, distilling, and starch-syrup production; functionally equivalent in role to Novonesis's current AMG (Amyloglucosidase) product line.", "Key Benefits": "Releases fermentable glucose from starch/dextrin substrates, improves crust color and loaf volume in baking (via Maillard browning from increased glucose), accelerates yeast fermentation/proofing, boosts ethanol yield in brewing/distilling applications.", "Mechanism of Action": "Glucoamylase hydrolyzes α-1,4 glycosidic bonds (and more slowly α-1,6 branch points) from the non-reducing ends of starch and dextrin polymer chains, sequentially cleaving individual glucose units — this releases fermentable glucose that fuels yeast fermentation (improving proofing/rise) and participates in Maillard browning reactions during baking (improving crust color).", "Dosage (Typical)": "Application-specific (typically tens to low hundreds of activity units per kg of substrate) — individual process trials recommended to determine optimal dosing for a given flour/starch substrate and desired outcome", "Dosage Form": "Liquid or granulated enzyme preparation for direct addition during processing", "Timing": "Added during flour blending/dough mixing (baking) or during starch liquefaction/saccharification steps (starch/brewing/distilling industries)", "Time to Effect": "Acts during fermentation/processing (minutes to hours, depending on application)", "Side Effects": "Not applicable for human consumption as a finished-food component (enzyme is substantially inactivated by baking/processing heat); occupational handling risk — repeated inhalation of enzyme dust/aerosols may cause sensitization and Type-1 allergic respiratory reactions in production workers, consistent with standard industrial enzyme handling precautions", "Contraindications": "Not applicable (processing aid, not a dietary supplement); occupational — avoid inhalation, follow standard enzyme-handling safety protocols", "Drug Interactions": "Not applicable", "Vendor 1": "Novonesis (formerly Novozymes)", "Vendor 1 Product details": "AMG (Amyloglucosidase) — current product line successor to legacy 'Novo'-branded glucoamylase products", "Vendor 1 Origin": "Denmark", "Vendor 2": "Ultreze Enzyme Private Limited", "Vendor 2  Product details": "Glucoamylase Enzyme (food/baking/starch-industry grade)", "Vendor 2 Origin": "India", "Vendor 3": "Vland Biotech", "Vendor 3 Product details": "Glucoamylase/Amyloglucosidase Enzyme", "Vendor 3 Origin": "China", "FDA Status": "GRAS as a food enzyme/processing aid (glucoamylase preparations from approved production organisms)", "EU Status": "Approved food enzyme under EU Food Enzyme Regulation (EC) No. 1332/2008", "India (FSSAI/AYUSH)": "Permitted food enzyme under FSSAI Food Safety and Standards (Food Products Standards and Food Additives) Regulations — confirm current approved-enzyme list entry for glucoamylase/amyloglucosidase", "Market Applications": "Industrial baking (bread, biscuits, crackers — crust color/volume improvement), brewing and distilling (fermentable sugar release for ethanol production), starch/glucose syrup manufacturing", "_id": 146, "_sheet": "Ingredients"}, {"Name": "Lipopan F", "Also Known As": "Phospholipase A1 (Fusarium oxysporum-derived); Novonesis/Novozymes Lipopan F", "Category": "Food Processing Enzyme", "Sub-Category": "Baking Enzyme - Dough Strengthening / Emulsifier Replacement", "Summary": "A phospholipase A1 enzyme preparation derived from Fusarium oxysporum, launched by Novozymes in 2001, used in baking to hydrolyze wheat lipids and generate emulsifying lysolecithin in situ, reducing the need for added chemical emulsifiers in dough.", "Key Benefits": "Strengthens dough, improves bread volume and crumb structure, reduces or replaces the need for chemical emulsifiers in longer-fermentation baking processes, improves overall bread appearance.", "Mechanism of Action": "Phospholipase A1 hydrolyzes the fatty acid ester bond on wheat flour's native polar lipids, releasing free fatty acids and generating lysolecithin in situ within the dough - this naturally-generated lysolecithin acts as an emulsifier, strengthening the gluten network and gas-retention capacity.", "Dosage (Typical)": "Up to 500 ppm of dough; typically 0.001-200 mg enzyme protein/kg dough, commonly lower end (0.01-10 mg EP/kg) for standard applications", "Dosage Form": "Liquid or granulated enzyme preparation, added during flour blending/dough mixing", "Timing": "Added during dough mixing/flour blending stage", "Time to Effect": "Acts during dough mixing and fermentation (minutes to hours)", "Side Effects": "Not applicable for human consumption (inactivated by baking heat); occupational handling risk - repeated inhalation of enzyme dust/aerosols may induce sensitization and Type-1 allergic reactions", "Contraindications": "Not applicable (processing aid); occupational - follow standard enzyme dust-handling precautions", "Drug Interactions": "Not applicable", "Vendor 1": "Novonesis (formerly Novozymes)", "Vendor 1 Product details": "Lipopan F (and successor Lipopan Xtra / Lipopan Prime)", "Vendor 1 Origin": "Denmark", "Vendor 2": "DSM-Firmenich", "Vendor 2  Product details": "Panamore (Golden/Spring)", "Vendor 2 Origin": "Netherlands/Switzerland", "Vendor 3": "Ultreze Enzyme Private Limited", "Vendor 3 Product details": "Phospholipase Enzyme (baking grade)", "Vendor 3 Origin": "India", "FDA Status": "GRAS as a food enzyme/processing aid", "EU Status": "Approved food enzyme under EU Food Enzyme Regulation (EC) No. 1332/2008", "India (FSSAI/AYUSH)": "Permitted food enzyme under FSSAI regulations - confirm current approved-enzyme list entry", "Market Applications": "Industrial and artisanal bread/bakery production, emulsifier-replacement strategies in bread improvers", "_id": 147, "_sheet": "Ingredients"}, {"Name": "Labisia pumila", "Also Known As": "Kacip Fatimah; Selusuh Fatimah; Pokok Ringgang; SLP+ (branded extract)", "Category": "Botanical Extract", "Sub-Category": "Women's Health / Reproductive Tonic Botanical", "Summary": "A leafy herb native to the Malaysian rainforest understory, traditionally known as Malaysia's national women's-health herb (Kacip Fatimah), used for generations by Malay women for feminine vitality, post-partum recovery, and menstrual/hormonal balance; commercially available as generic extracts and the patented, clinically studied SLP+ branded extract from Biotropics Malaysia.", "Key Benefits": "Supports feminine vitality and energy, menstrual cycle regulation, post-partum recovery, traditional use for libido and well-being; SLP+ has clinical support for menstrual health symptoms, stress, sleep, memory and concentration.", "Mechanism of Action": "Traditionally attributed to estrogen-like/phytoestrogenic compounds; modern in vitro research indicates several isolated root constituents modulate cytochrome P450 enzymes (CYPs), P-glycoprotein (P-gp), and the Pregnane X Receptor (PXR) - the three main regulators of drug absorption, distribution and metabolism - giving a mechanistic basis for a documented herb-drug interaction risk.", "Dosage (Typical)": "Traditional decoction: whole plant boiled in water; standardized extract (e.g., SLP+) generally 1-2 capsules/day standardized to gallic acid content (0.3-0.8%)", "Dosage Form": "Herbal tea/decoction, standardized extract powder, capsules, tablets", "Timing": "Traditionally taken during pregnancy (1-2 months pre-childbirth) and postpartum; general wellness use typically daily", "Time to Effect": "Weeks for general wellness/hormonal-balance effects", "Side Effects": "Generally well tolerated with no acute toxicity reported in clinical studies; mild side effects can occur depending on extraction solvent used", "Contraindications": "Pregnancy (outside of supervised traditional pre-childbirth use); estrogen-sensitive conditions (theoretical caution)", "Drug Interactions": "In vitro evidence indicates root constituents modulate CYP enzymes, P-glycoprotein, and PXR activity - a real risk of herb-drug interactions for concomitant medications; mandatory caution combining with prescription drugs", "Vendor 1": "Biotropics Malaysia Berhad", "Vendor 1 Product details": "SLP+ (patented, clinically studied, gallic-acid-standardized extract)", "Vendor 1 Origin": "Malaysia", "Vendor 2": "Bionutricia Holding Sdn Bhd", "Vendor 2  Product details": "Kacip Fatimah Standardized Extract Powder (ultrasonic hot-water extraction, 0.3-0.8% gallic acid)", "Vendor 2 Origin": "Malaysia", "Vendor 3": "Runherb Inc.", "Vendor 3 Product details": "Kacip Fatimah Extract Powder (10:1 whole-herb water extract)", "Vendor 3 Origin": "China (processing) - verify Malaysian-origin authenticity", "FDA Status": "Dietary ingredient marketed under DSHEA; not FDA-evaluated for specific claims", "EU Status": "Permitted botanical food supplement ingredient; no authorized EFSA-specific health claim", "India (FSSAI/AYUSH)": "Not a traditional AYUSH botanical (native to Malaysia) - regulated as an imported novel botanical under FSSAI", "Market Applications": "Women's health supplements (menstrual health, post-partum recovery, menopause support), traditional Malay wellness tonics", "_id": 148, "_sheet": "Ingredients"}, {"Name": "Tiger Milk Mushroom", "Also Known As": "Lignosus rhinocerus / Lignosus rhinocerotis; Cendawan Susu Rimau; LiGNO TM02 (branded extract)", "Category": "Medicinal Mushroom", "Sub-Category": "Respiratory & Immune Health Sclerotium Extract", "Summary": "A rare Southeast Asian medicinal mushroom, Malaysia's 'national treasure,' valued for its underground sclerotium rather than fruiting body; used for over 400 years across Malaysia, Indonesia, Thailand, the Philippines and Southern China primarily for respiratory ailments, with cultivation only recently made commercially viable after centuries of failed attempts.", "Key Benefits": "Supports respiratory/lung function and bronchial comfort, immune modulation via beta-glucan content, antioxidant activity, some evidence for nerve growth factor (NGF)-mimetic cognitive support; clinical trial showed reduced respiratory inflammatory markers and improved respiratory IgA.", "Mechanism of Action": "The sclerotium is rich in 1,3-1,6 beta-glucans and total polysaccharides that stimulate macrophages and dendritic cells; also contains fibrinolytic enzymes supporting circulation, and bioactive compounds interacting with the TrkA receptor (the same pathway nerve growth factor uses).", "Dosage (Typical)": "300 mg twice daily (used in the primary 3-month clinical trial); commercial products range 200-500 mg standardized sclerotium extract per serving", "Dosage Form": "Capsule, powder (mixed with water/juice/tea)", "Timing": "Twice daily, with or without food; consistency emphasized for cumulative benefit", "Time to Effect": "Clinical trial showed significant biomarker changes over 3 months; anecdotal reports suggest some users notice effects within weeks", "Side Effects": "No reported adverse events over 3 months in the primary open-label trial; OECD-guideline toxicity studies found no adverse changes in body weight, liver, kidney, heart, spleen, lung function or fertility", "Contraindications": "Mushroom/fungal allergy; limited safety data in pregnancy/lactation given recent commercialization", "Drug Interactions": "None significant established in current literature, though formal drug-interaction studies are limited", "Vendor 1": "LiGNO Holdings", "Vendor 1 Product details": "LiGNO TM02 (cultivated sclerotium, most clinically referenced branded extract)", "Vendor 1 Origin": "Malaysia (Sarawak)", "Vendor 2": "Nootropics Depot", "Vendor 2  Product details": "Tiger Milk Mushroom Capsules (cultivated sclerotium, >50% beta-glucan)", "Vendor 2 Origin": "USA (sourcing cultivated Malaysian sclerotia)", "Vendor 3": "FC Materials Sdn. Bhd.", "Vendor 3 Product details": "Standardized Sclerotium Extract for formulators", "Vendor 3 Origin": "Malaysia", "FDA Status": "Dietary ingredient marketed under DSHEA; not FDA-evaluated for respiratory claims", "EU Status": "Limited regulatory history given rarity and recent cultivation breakthrough - verify novel food status before EU entry", "India (FSSAI/AYUSH)": "Not a traditional AYUSH botanical - requires import/novel-ingredient documentation under FSSAI", "Market Applications": "Respiratory/lung health supplements, immune support formulas, cognitive/nootropic stacks (paired with Lion's Mane)", "_id": 149, "_sheet": "Ingredients"}, {"Name": "Broccoli Sprouts", "Also Known As": "Brassica oleracea Sprout Extract; Sulforaphane/Glucoraphanin Concentrate; BroccoPhane (branded)", "Category": "Functional Food Extract", "Sub-Category": "Cruciferous Phytochemical (Isothiocyanate) Concentrate", "Summary": "Extract or powder from young broccoli sprouts (harvested 3-4 days after germination), containing up to 50x the glucosinolate concentration of mature broccoli; glucoraphanin is converted by myrosinase into sulforaphane, one of the most studied phytochemicals for Phase II detoxification enzyme induction.", "Key Benefits": "Potent activation of the Nrf2 antioxidant defense pathway, supports Phase II detoxification enzyme induction, liver health support, antioxidant and anti-inflammatory activity, emerging research on cellular health and healthy aging.", "Mechanism of Action": "Sulforaphane (formed from glucoraphanin via myrosinase action) activates the Keap1-Nrf2-ARE signaling pathway, inducing transcription of over 200 cytoprotective genes including Phase II detoxification enzymes that neutralize free radicals and process toxins/carcinogens.", "Dosage (Typical)": "200 mcg-2,000 mcg sulforaphane equivalent/day (varies significantly by delivery format)", "Dosage Form": "Capsule, tablet, powder; delivery format (with/without active myrosinase) significantly affects actual sulforaphane bioavailability", "Timing": "With or without food; some formulations recommend away from food to preserve myrosinase activity", "Time to Effect": "Phase II enzyme induction detectable within hours to days in research; cumulative benefits assessed over weeks", "Side Effects": "Generally well tolerated; mild GI upset (gas, bloating) possible", "Contraindications": "Thyroid conditions (goitrogenic compounds at very high intakes - moderate supplement doses are generally low risk but caution in existing thyroid dysfunction); pregnancy (consult provider before high-dose use)", "Drug Interactions": "Sulforaphane induces certain Phase II/cytochrome pathways, theoretically affecting clearance of co-administered drugs metabolized via the same pathways - not well-documented clinically but reasonable formulation-level caution", "Vendor 1": "Bioriginal Food & Science Corp", "Vendor 1 Product details": "BroccoPhane (standardized to >4000ppm sulforaphane, solvent-free)", "Vendor 1 Origin": "USA", "Vendor 2": "Brassica Protection Products", "Vendor 2  Product details": "BroccoRaphanin / Avmacol (glucoraphanin + active myrosinase format)", "Vendor 2 Origin": "USA", "Vendor 3": "Star Hi Herbs / Botanic Healthcare", "Vendor 3 Product details": "Broccoli Sprout Extract (glucoraphanin-standardized) - verify current catalog availability", "Vendor 3 Origin": "India", "FDA Status": "GRAS as a food ingredient; dietary supplement ingredient under DSHEA", "EU Status": "Permitted food/supplement ingredient; treated as conventional food-derived rather than novel food", "India (FSSAI/AYUSH)": "Permitted vegetable/sprout-derived food ingredient under FSSAI regulations", "Market Applications": "Antioxidant/cellular health supplements, liver detoxification formulas, longevity stacks, often combined with myrosinase-active ingredients", "_id": 150, "_sheet": "Ingredients"}, {"Name": "BGA (Blue-Green Algae)", "Also Known As": "Aphanizomenon flos-aquae (AFA); Klamath Lake Algae; Cyanobacteria-derived supplement", "Category": "Algae-Derived Supplement", "Sub-Category": "Cyanobacterial Superfood / Phycocyanin Source", "Summary": "A freshwater cyanobacterium (commonly Aphanizomenon flos-aquae) harvested almost exclusively from Upper Klamath Lake, Oregon - one of the few naturally-occurring sources, since AFA is difficult to cultivate under controlled conditions, unlike Spirulina which can be farmed in controlled ponds. IMPORTANT: this wild-harvest dependency creates a well-documented, ongoing cyanotoxin contamination risk distinguishing it sharply from controlled-cultivation algae.", "Key Benefits": "Antioxidant activity via phycocyanin content, immune cell mobilization effects observed in human studies, broad micronutrient profile, claimed mood/cognitive support via phenethylamine content.", "Mechanism of Action": "Phycocyanin exhibits antioxidant and anti-inflammatory activity by scavenging free radicals and inhibiting pro-inflammatory pathways (including COX-2 and leukotriene B4); rapid effects on immune cell circulation following AFA consumption have been documented in human studies.", "Dosage (Typical)": "1-3 g/day typical commercial dosing; research doses have varied widely", "Dosage Form": "Powder, capsules, tablets, fresh-frozen liquid", "Timing": "With or without food, per product directions", "Time to Effect": "Acute immune-cell mobilization effects reported within hours in research; antioxidant/wellness effects assessed over weeks", "Side Effects": "Generally well tolerated in toxin-free product; AFA supplements have a documented recurring history of contamination with hepatotoxic (microcystin) and potentially neurotoxic (BMAA, saxitoxin, cylindrospermopsin) cyanotoxins due to co-occurring toxin-producing species in the same wild lake source", "Contraindications": "Autoimmune conditions (case reports of autoimmunity activation following immunostimulatory herbal supplement use have been documented); should not be used without verified current third-party cyanotoxin testing on the specific batch/lot", "Drug Interactions": "Anaphylaxis to Spirulina (a related cyanobacterium) confirmed by skin-prick testing - general cross-reactivity caution for algae-sensitive individuals", "Vendor 1": "E3Live", "Vendor 1 Product details": "E3Live (fresh-frozen liquid, freeze-dried powder and capsule AFA products)", "Vendor 1 Origin": "USA (Klamath Falls, Oregon)", "Vendor 2": "The Synergy Company", "Vendor 2  Product details": "Pure Synergy / Super Algae blends", "Vendor 2 Origin": "USA (Oregon sourcing)", "Vendor 3": "Cell Tech", "Vendor 3 Product details": "Super Blue-Green Algae", "Vendor 3 Origin": "USA (Klamath Falls, Oregon)", "FDA Status": "Marketed as a dietary supplement under DSHEA; subject to general cGMP contaminant-testing requirements", "EU Status": "Permitted food supplement ingredient with no specific authorized health claim; EU/Italian market surveys have documented microcystin contamination in commercial BGA supplements", "India (FSSAI/AYUSH)": "Not a traditional AYUSH ingredient - mandatory cyanotoxin testing recommended as a condition of any import approval under FSSAI", "Market Applications": "General wellness/antioxidant superfood powders, immune-support supplements, green-superfood blends", "_id": 151, "_sheet": "Ingredients"}, {"Name": "Tenggek Burung", "Also Known As": "Melicope lunu-ankenda; Euodia; regional vernacular names vary", "Category": "Botanical / Traditional Malay Herb", "Sub-Category": "Traditional Cold & Rheumatism Remedy", "Summary": "An evergreen deciduous tree native to tropical Asia (growing up to 30m tall), known in Malaysia as Tenggek Burung, traditionally harvested from the wild for food, medicine, and wood; used in Malay traditional medicine for colds and rheumatism. NOTE: confirm exact botanical identity with supplier voucher specimen documentation, as vernacular plant names in Malay/Indonesian markets can overlap across unrelated species.", "Key Benefits": "Traditional use for treating colds, fever, and rheumatic/joint complaints; the broader Melicope genus shows anti-inflammatory and antimicrobial phytochemical activity in regional ethnobotanical literature.", "Mechanism of Action": "Traditional rationale rather than a well-characterized modern mechanism specific to this species; the Melicope genus broadly contains coumarins, alkaloids, and flavonoids associated with anti-inflammatory/antimicrobial activity in related species, but species-specific data on M. lunu-ankenda is limited.", "Dosage (Typical)": "Traditional decoction/infusion of leaves or bark; no standardized modern clinical dosing established", "Dosage Form": "Dried leaf/bark, traditional decoction", "Timing": "As directed in traditional Malay medicine practice, typically for acute symptom relief", "Time to Effect": "Not established in modern clinical terms", "Side Effects": "No significant modern toxicological data found - a genuine data gap", "Contraindications": "Not established in modern literature - data gap, not confirmed absence of risk", "Drug Interactions": "Not established in modern pharmacological literature - data gap", "Vendor 1": "Herbalwise Holdings Sdn Bhd", "Vendor 1 Product details": "Tenggek Burung / Euodia (raw dried herb)", "Vendor 1 Origin": "Malaysia", "Vendor 2": "General Malaysian traditional herb (Ubat Kampung) suppliers - verify current GMP-certified options", "Vendor 2  Product details": "Tenggek Burung (raw/dried form)", "Vendor 2 Origin": "Malaysia", "Vendor 3": "Not separately identified - a niche, primarily wild-harvested herb with limited standardized extract availability", "Vendor 3 Product details": "N/A", "Vendor 3 Origin": "N/A", "FDA Status": "Not FDA-evaluated; not a recognized US dietary ingredient", "EU Status": "Not a recognized EU novel food/traditional botanical with established status", "India (FSSAI/AYUSH)": "Native to Malaysia/wider tropical Asia rather than the Indian AYUSH pharmacopoeia - would require import/novel-ingredient documentation", "Market Applications": "Traditional Malay herbal cold/rheumatism remedies - limited modern commercial product development found", "_id": 152, "_sheet": "Ingredients"}, {"Name": "Chicken Sternal Cartilage Powder", "Also Known As": "UC-II (Undenatured Type II Collagen); Unstergen (branded); Chicken Sternum Cartilage Extract", "Category": "Collagen / Connective Tissue Ingredient", "Sub-Category": "Undenatured Type II Collagen (Joint Health)", "Summary": "A specialized collagen extracted from chicken sternum cartilage using a low-temperature process (below 60C) that preserves the native triple-helix structure of Type II collagen - distinct from hydrolyzed collagen, working through an immune-mediated 'oral tolerance' mechanism rather than amino-acid building-block supply.", "Key Benefits": "Supports joint comfort, mobility and flexibility in osteoarthritis and general joint-health contexts, reduces inflammation in rheumatoid arthritis in some studies, provides mucopolysaccharides (chondroitin sulfate, glucosamine, hyaluronic acid), low effective daily dose (40 mg) vs. hydrolyzed collagen (grams).", "Mechanism of Action": "Works via 'oral tolerance' - intact, undenatured Type II collagen reaching the small intestine interacts with Peyer's patches, training the immune system to reduce autoimmune-type attacks on joint cartilage, rather than primarily acting as a building-block amino acid source.", "Dosage (Typical)": "40 mg/day undenatured Type II collagen (clinically established effective dose)", "Dosage Form": "Capsule, tablet, powder; must be processed at low temperature to preserve undenatured structure", "Timing": "Once daily, with or without food", "Time to Effect": "Clinical studies show measurable joint-comfort improvements within 90 days; some report effects within a few weeks", "Side Effects": "Multiple studies confirm safety with no significant adverse effects with long-term use", "Contraindications": "Poultry/chicken allergy", "Drug Interactions": "None clinically significant established", "Vendor 1": "Titan Biotech Limited (Unstergen)", "Vendor 1 Product details": "Unstergen - Undenatured Chicken Collagen Type II", "Vendor 1 Origin": "India", "Vendor 2": "InterHealth Nutraceuticals", "Vendor 2  Product details": "UC-II (original patented branded ingredient)", "Vendor 2 Origin": "USA", "Vendor 3": "Lifeworth (naturallifeworth.com)", "Vendor 3 Product details": "UC-II Collagen / Undenatured Type II Collagen (bulk, OEM/ODM available)", "Vendor 3 Origin": "China", "FDA Status": "GRAS/dietary ingredient under DSHEA; UC-II protected by multiple US patents", "EU Status": "Permitted food supplement ingredient; protected by EPO patent for the branded UC-II form", "India (FSSAI/AYUSH)": "Permitted nutraceutical/joint-health ingredient under FSSAI - India has an established domestic manufacturing base (Titan Biotech/Unstergen)", "Market Applications": "Joint health supplements (osteoarthritis, rheumatoid arthritis, sports joint support), often combined with mineralized algae sources", "_id": 153, "_sheet": "Ingredients"}, {"Name": "Tocotrienol Complex from Palm Press Fiber", "Also Known As": "Palm Tocotrienol-Rich Fraction (Palm TRF); Tocomin/Tocomin SupraBio; DavosLife E3", "Category": "Vitamin E (Tocotrienol Form)", "Sub-Category": "Full-Spectrum Tocotrienol/Tocopherol Complex", "Summary": "A natural, full-spectrum Vitamin E complex (alpha, beta, gamma, delta-tocotrienols plus alpha-tocopherol) extracted and concentrated from virgin red palm oil/palm press fiber - palm fruit is the unique plant source containing all four tocotrienol isomers, unlike rice bran (1:1 ratio) or annatto (predominantly 2 isomers).", "Key Benefits": "Antioxidant and anti-ferroptosis activity (research indicates tocotrienols up to 15x stronger than tocopherols at inhibiting ferroptosis), cognitive function support (Malaysian MOH-authorized claim), bone density support, cardiovascular/cholesterol support, NAFLD research interest, skin/telomere-protective research.", "Mechanism of Action": "Tocotrienols share Vitamin E's antioxidant mechanism with an unsaturated isoprenoid side chain allowing more efficient membrane penetration; gamma-tocotrienol additionally inhibits HMG-CoA reductase post-transcriptionally and suppresses adipocyte fat-cell production while improving insulin sensitivity in preclinical research.", "Dosage (Typical)": "100-200 mg mixed tocotrienols/day; Malaysian MOH health-claim threshold requires minimum 10mg pure tocotrienols per 100g/100ml finished product", "Dosage Form": "Softgel (oil-based), self-emulsifying delivery system (SEDS) formulations, water-dispersible powder", "Timing": "With meals (fat-soluble, absorption improved with dietary fat)", "Time to Effect": "Weeks for cholesterol/lipid marker changes; cognitive claims based on longer-term studies", "Side Effects": "Generally well tolerated; CIR Expert Panel concluded Tocotrienol-Rich Fraction safe as used; high doses carry a theoretical bleeding-risk caution", "Contraindications": "Patients on anticoagulant/antiplatelet therapy (general Vitamin E caution); upcoming surgery", "Drug Interactions": "May potentiate anticoagulant/antiplatelet medications at higher doses; gamma-tocotrienol's HMG-CoA reductase inhibition could theoretically have additive effects with statins", "Vendor 1": "ExcelVite Inc. (KLK OLEO subsidiary)", "Vendor 1 Product details": "Tocomin SupraBio / EVNol SupraBio (patented self-emulsifying delivery, GRAS-approved)", "Vendor 1 Origin": "Malaysia", "Vendor 2": "Davos Life Science (KLK OLEO)", "Vendor 2  Product details": "DavosLife E3 (full-spectrum, oil and water-dispersible powder forms)", "Vendor 2 Origin": "Malaysia", "Vendor 3": "PhytoGaia Sdn Bhd", "Vendor 3 Product details": "TocoGaia (solvent-free extraction, holds Malaysian MOH-authorized cognitive function claim)", "Vendor 3 Origin": "Malaysia", "FDA Status": "GRAS (Carotech/Tocomin received FDA final notification of no objection for GRAS in April 2010)", "EU Status": "Permitted food supplement ingredient", "India (FSSAI/AYUSH)": "Permitted Vitamin E (tocotrienol form) nutraceutical ingredient under FSSAI - DavosLife E3 holds an Indian patent relevant to formulation/process protection", "Market Applications": "Healthy-aging/longevity supplements, cognitive health formulas, cardiovascular/cholesterol support, NAFLD-adjacent liver products, skin/anti-aging cosmeceuticals", "_id": 154, "_sheet": "Ingredients"}, {"Name": "Honeybush (Cyclopia spp.)", "Also Known As": "Cyclopia genistoides/subternata/intermedia Leaf Extract; Green Honeybush", "Category": "Botanical Extract", "Sub-Category": "Polyphenol Antioxidant (Xanthone-Rich)", "Summary": "An endemic South African fynbos shrub (genus Cyclopia, family Fabaceae) traditionally brewed as a caffeine-free, low-tannin herbal tea with a sweet honey-like aroma; commercial 'green' (unfermented) honeybush extracts retain significantly higher phenolic content than the traditional fermented tea, making them the preferred raw material for nutraceutical and cosmetic antioxidant applications.", "Key Benefits": "Potent antioxidant and free-radical scavenging activity (rich in mangiferin, isomangiferin, hesperidin), anti-inflammatory effects, anti-mutagenic/anti-cancer research interest, skin anti-aging benefits, traditional digestive-soothing and immune-supporting use, antidiabetic potential (mangiferin specifically).", "Mechanism of Action": "Mangiferin and isomangiferin and associated flavanones provide direct free-radical scavenging and have demonstrated mitochondrial-function-protective effects against oxidative injury in neuronal cell models; topically, extracts suppress collagen breakdown reactions and inhibit UV-induced epidermal thickening.", "Dosage (Typical)": "Herbal tea: 1-2 cups/day (traditional use, including for nursing mothers/babies); standardized extract typically standardized to a minimum 1.5% mangiferin", "Dosage Form": "Dried tea leaves/cut herb, aqueous extract powder, hydro-glycolic cosmetic extract, capsules", "Timing": "Any time of day; caffeine-free profile suitable for evening consumption", "Time to Effect": "Immediate (as a beverage); weeks for measurable antioxidant/skin-appearance changes with standardized extract use", "Side Effects": "Very well tolerated - traditional use specifically includes nursing mothers and babies; low tannin content reduces mild GI effects seen with high-tannin teas", "Contraindications": "None significant established; phytoestrogen content suggests theoretical caution in hormone-sensitive conditions pending more data", "Drug Interactions": "Mangiferin has demonstrated antidiabetic properties - theoretical caution for additive glucose-lowering effect if combined with antidiabetic medications, though not well-documented clinically at typical intake", "Vendor 1": "Zuplex (South Africa)", "Vendor 1 Product details": "Green Honeybush - Cyclopia genistoides Leaf Extract (hydro-glycolic and propanediol-based cosmetic grades)", "Vendor 1 Origin": "South Africa (Western Cape)", "Vendor 2": "Unifect", "Vendor 2  Product details": "Green Honeybush-GLY (hydro-glycolic extraction)", "Vendor 2 Origin": "South Africa", "Vendor 3": "South African Honeybush Tea Association (SAHTA)-affiliated growers/processors - verify current export-ready suppliers", "Vendor 3 Product details": "Honeybush Tea/Extract (food-grade, standardized mangiferin content)", "Vendor 3 Origin": "South Africa (Western and Eastern Cape)", "FDA Status": "Marketed as a conventional food/herbal tea ingredient; not FDA-evaluated for specific claims", "EU Status": "Permitted traditional food/herbal tea ingredient", "India (FSSAI/AYUSH)": "Not a traditional AYUSH botanical (endemic to South Africa) - requires import/novel-ingredient documentation under FSSAI", "Market Applications": "Herbal tea (standalone and blended), antioxidant dietary supplements, anti-aging cosmetic/skincare formulations, functional food/beverage fortification", "_id": 155, "_sheet": "Ingredients"}, {"Name": "Aspalathus linearis", "Also Known As": "Rooibos, Red Bush Tea, Red Tea, South African Red Bush", "Category": "Botanical / Functional Beverage", "Sub-Category": "Antioxidant Herbal Tea", "Summary": "Aspalathus linearis (Rooibos) is a leguminous shrub native to South Africa's Cederberg region, traditionally processed into a caffeine-free herbal tea. It contains unique polyphenols including aspalathin and nothofagin found nowhere else in nature, along with quercetin and luteolin, contributing to its antioxidant, anti-inflammatory, and antidiabetic properties.", "Key Benefits": "Antioxidant protection; Blood sugar regulation; Cardiovascular support; Anti-inflammatory; Caffeine-free relaxation; Skin health; Liver protection", "Mechanism of Action": "Aspalathin (unique C-glucosyl dihydrochalcone) stimulates glucose uptake via AMPK and GLUT4 translocation; inhibits alpha-glucosidase; reduces oxidative stress via Nrf2 pathway activation; chrysoeriol and quercetin provide anti-inflammatory COX-2 inhibition; absence of caffeine and low tannin content distinguishes it from black/green tea.", "Dosage (Typical)": "2–6 g dried leaf/day as tea (2–3 cups); standardized extract: 100–250 mg aspalathin-rich extract/day", "Dosage Form": "Tea (loose leaf/bags), Capsule, Liquid Extract, Powder", "Timing": "Any time of day (caffeine-free); often consumed evening due to lack of stimulant effect", "Time to Effect": "Acute antioxidant: 1–2 hours; Blood sugar/metabolic effects: 4–8 weeks of regular consumption", "Side Effects": "Very well tolerated; rare mild GI upset; theoretical concern with very high doses and liver enzyme changes (limited evidence)", "Contraindications": "Hormone-sensitive conditions (mild phytoestrogenic activity—theoretical); limited safety data in pregnancy/breastfeeding at supplement (non-tea) doses", "Drug Interactions": "May have mild interaction with CYP-metabolized drugs (limited data); theoretical additive effect with antidiabetic medications", "Vendor 1": "Rooibos Ltd (South Africa)", "Vendor 1 Product details": "Certified Organic Rooibos Tea / Extract", "Vendor 1 Origin": "South Africa (Cederberg region)", "Vendor 2": "Annique / Carmién Tea", "Vendor 2  Product details": "Fermented & Green (unfermented) Rooibos Extract", "Vendor 2 Origin": "South Africa", "Vendor 3": "Solaray / NOW Foods", "Vendor 3 Product details": "Rooibos Tea Capsules", "Vendor 3 Origin": "South Africa (sourced) / USA (packaged)", "FDA Status": "GRAS (food/herbal tea); dietary supplement under DSHEA; no specific FDA health claim", "EU Status": "Permitted food supplement; widely sold as herbal tea across EU; EFSA no specific health claim opinion approved", "India (FSSAI/AYUSH)": "FSSAI-permitted imported herbal tea ingredient; growing presence in Indian premium tea/wellness market; not in AYUSH traditional schedules (non-native plant)", "Market Applications": "Herbal/functional teas; Antioxidant supplements; Diabetic-friendly beverages; Skin care (cosmeceutical); Children's caffeine-free beverages; Stress relief blends", "_id": 156, "_sheet": "Ingredients"}, {"Name": "Misai Kucing (Orthosiphon stamineus)", "Also Known As": "Cat's Whiskers, Java Tea, Kumis Kucing, Orthosiphon aristatus", "Category": "Botanical / Traditional Herb", "Sub-Category": "Diuretic / Renal Support Herb", "Summary": "Orthosiphon stamineus is a flowering plant native to Southeast Asia (Malaysia, Indonesia) and tropical Australia, named for its distinctive whisker-like stamens. Traditionally used in Malay and Indonesian (Jamu) medicine as a diuretic and for kidney/urinary health, it contains sinensetin, eupatorin, rosmarinic acid, and orthosiphol terpenes.", "Key Benefits": "Diuretic action (mild); Kidney stone prevention; Urinary tract health; Blood pressure support; Antioxidant; Anti-inflammatory; Blood sugar regulation (preclinical)", "Mechanism of Action": "Sinensetin and eupatorin (polymethoxylated flavones) exhibit diuretic activity by increasing renal blood flow and sodium/potassium excretion; rosmarinic acid provides antioxidant and anti-inflammatory effects; orthosiphol terpenoids inhibit xanthine oxidase (relevant to gout/kidney stones); mild ACE-inhibitory activity supports blood pressu
