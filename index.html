<script>
/* ============================================================
   IVP Index — app logic
   All data comes from data.js (window.IVP_DATA), produced from
   the source workbook. No backend: everything runs client-side.
   ============================================================ */

(function () {
  "use strict";

  const DATA = window.IVP_DATA;
  const SHEETS = DATA.sheets;                       // array of sheet objects
  const SHEET_BY_KEY = Object.fromEntries(SHEETS.map(s => [s.key, s]));
  const SECTIONS = DATA.sections;                    // array of {id, name, sheetKeys}

  const FACET_MAX_VISIBLE = 8;
  const FREE_TEXT_AVG_LEN = 45;
  const MAX_FACET_CARDINALITY = 50;
  const UNIQUE_RATIO_CUTOFF = 0.9;
  const MIN_ROWS_FOR_UNIQUE_CHECK = 8;

  // Curated, hand-picked "primary" filters per section — these are the categories
  // that matter most for browsing that section, and similar-type columns spread
  // across multiple sheets (e.g. Vendor 1/2/3, or Country + HQ Country) are merged
  // into a single consolidated filter tag rather than repeated separately.
  const CURATED_FILTERS = {
    "ivp-database": [
      { key: "Category", label: "Category", sources: [{ sheet: "Ingredients", column: "Category" }] },
      { key: "Sub-Category", label: "Sub-Category", sources: [{ sheet: "Ingredients", column: "Sub-Category" }] },
      { key: "Vendor", label: "Vendor", sources: [
        { sheet: "Ingredients", column: "Vendor 1" },
        { sheet: "Ingredients", column: "Vendor 2" },
        { sheet: "Ingredients", column: "Vendor 3" },
      ]},
      { key: "Brand / Company", label: "Brand / Company", sources: [
        { sheet: "Branded products", column: "Brand / Company" },
        { sheet: "Branded Ingredients", column: "Manufacturer" },
      ]},
      { key: "Product", label: "Product", sources: [{ sheet: "Branded products", column: "Product Name" }] },
      { key: "Product Type", label: "Product Type", sources: [{ sheet: "Branded products", column: "Product Type" }] },
      { key: "Format", label: "Format", sources: [{ sheet: "Branded products", column: "Format" }] },
    ],
    "formats-tech": [
      { key: "Institute", label: "Institute", sources: [{ sheet: null, column: "Institute" }] },
      { key: "Category", label: "Category", sources: [{ sheet: null, column: "Category" }] },
      { key: "Target Group", label: "Target Group", sources: [{ sheet: null, column: "TG" }] },
      { key: "Target", label: "Target", sources: [{ sheet: null, column: "Target" }] },
    ],
  };

  const state = {
    sectionId: SECTIONS[0].id,  // always one specific section — sections are independent, never merged
    sheetKey: "all",            // 'all' (= all sheets in this section) | specific sheet key
    query: "",
    filters: {}                 // { filterKey: Set(tokens) }
  };

  let fuseCache = { sig: null, fuse: null, rows: null };
  let currentFilterDefs = [];  // the filter definitions backing the sidebar for the current render

  // ---------- DOM refs ----------
  const els = {
    sectionTabs: document.getElementById("sectionTabs"),
    sheetTabs: document.getElementById("sheetTabs"),
    searchInput: document.getElementById("searchInput"),
    clearSearch: document.getElementById("clearSearch"),
    resultTally: document.getElementById("resultTally"),
    filterGroups: document.getElementById("filterGroups"),
    resetFilters: document.getElementById("resetFilters"),
    cardList: document.getElementById("cardList"),
    emptyState: document.getElementById("emptyState"),
    emptyReset: document.getElementById("emptyReset"),
  };

  // ---------- helpers ----------
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function linkify(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(/(https?:\/\/[^\s)]+)/g, url => {
      const clean = url.replace(/[.,;]+$/, "");
      const trailing = url.slice(clean.length);
      return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${trailing}`;
    });
  }

  function tokenize(value) {
    return String(value)
      .split(/\s*[,;]\s*/)
      .map(t => t.trim())
      .filter(Boolean);
  }

  function normalizeToken(t) {
    return t.toLowerCase();
  }

  function getCurrentSection() {
    return SECTIONS.find(s => s.id === state.sectionId);
  }

  function getSheetsForCurrentTab() {
    if (state.sheetKey !== "all") return [SHEET_BY_KEY[state.sheetKey]];
    const section = getCurrentSection();
    return section.sheetKeys.map(k => SHEET_BY_KEY[k]);
  }

  function getActiveRows(sheets) {
    const rows = [];
    for (const sheet of sheets) {
      for (const row of sheet.rows) rows.push(row);
    }
    return rows;
  }

  // ---------- fuzzy search ----------
  function getFuse(sheets, rows) {
    const sig = sheets.map(s => s.key).join(",") + "|" + rows.length;
    if (fuseCache.sig === sig) return fuseCache.fuse;

    const keySet = new Set();
    sheets.forEach(s => s.columns.forEach(c => keySet.add(c)));
    const keys = Array.from(keySet);

    const fuse = new Fuse(rows, {
      keys,
      threshold: 0.34,
      ignoreLocation: true,
      minMatchCharLength: 2,
      includeScore: false,
    });
    fuseCache = { sig, fuse, rows };
    return fuse;
  }

  // ---------- facet detection (auto, data-driven, consolidated across sheets) ----------
  function getAutoFilterDefs(activeSheets, excludeColumns) {
    // Union of column names across active sheets, preserving first-seen order,
    // excluding each sheet's own title field and any column already covered by a curated filter.
    const titleFields = new Set(activeSheets.map(s => s.titleField));
    const seen = new Set();
    const defs = [];
    for (const sheet of activeSheets) {
      for (const column of sheet.columns) {
        if (titleFields.has(column) || seen.has(column) || excludeColumns.has(column)) continue;
        seen.add(column);
        // sheet: null => this column name is matched on any row that has it, regardless of sheet
        defs.push({ key: column, label: column, sources: [{ sheet: null, column }] });
      }
    }
    return defs;
  }

  function getValuesForDef(def, row) {
    const values = [];
    for (const src of def.sources) {
      if (src.sheet && src.sheet !== row._sheet) continue;
      const v = row[src.column];
      if (v !== undefined && v !== null && v !== "") values.push(v);
    }
    return values;
  }

  function computeFacetForDef(def, rows, { bypassCardinalityCap = false } = {}) {
    const values = [];
    for (const row of rows) values.push(...getValuesForDef(def, row));
    if (values.length === 0) return null;

    if (!bypassCardinalityCap) {
      const avgLen = values.reduce((sum, v) => sum + String(v).length, 0) / values.length;
      if (avgLen > FREE_TEXT_AVG_LEN) return null;
    }

    // Group tokens case-insensitively (so "Gut health" and "gut health" become one
    // option) while keeping whichever original casing was most common as the label.
    const tokenCounts = new Map(); // normalizedToken -> { label, idSet, labelTally: Map(rawLabel->count) }
    for (const row of rows) {
      const rowValues = getValuesForDef(def, row);
      if (rowValues.length === 0) continue;
      const rawTokens = new Set(rowValues.flatMap(tokenize));
      for (const raw of rawTokens) {
        const norm = normalizeToken(raw);
        if (!tokenCounts.has(norm)) tokenCounts.set(norm, { label: raw, idSet: new Set(), labelTally: new Map() });
        const entry = tokenCounts.get(norm);
        entry.idSet.add(row._id);
        entry.labelTally.set(raw, (entry.labelTally.get(raw) || 0) + 1);
      }
    }
    // finalize each group's display label as whichever casing variant occurred most often
    for (const entry of tokenCounts.values()) {
      let bestLabel = entry.label, bestCount = -1;
      for (const [label, count] of entry.labelTally) {
        if (count > bestCount || (count === bestCount && label < bestLabel)) { bestLabel = label; bestCount = count; }
      }
      entry.label = bestLabel;
      delete entry.labelTally;
    }

    const uniqueTokenCount = tokenCounts.size;
    if (uniqueTokenCount === 0) return null;
    if (!bypassCardinalityCap) {
      if (uniqueTokenCount > MAX_FACET_CARDINALITY) return null;
      const uniqueRatio = uniqueTokenCount / values.length;
      if (uniqueRatio > UNIQUE_RATIO_CUTOFF && values.length > MIN_ROWS_FOR_UNIQUE_CHECK) return null;
    }

    return { def, tokenCounts, coverage: values.length };
  }


  // ---------- filtering ----------
  function rowMatchesFilters(row) {
    for (const key in state.filters) {
      const selected = state.filters[key];
      if (!selected || selected.size === 0) continue;
      const def = currentFilterDefs.find(d => d.key === key);
      if (!def) continue; // filter no longer applicable in this view; ignore rather than exclude everything
      const rowValues = getValuesForDef(def, row);
      if (rowValues.length === 0) return false;
      const tokens = rowValues.flatMap(tokenize).map(normalizeToken);
      const hit = tokens.some(t => selected.has(t));
      if (!hit) return false;
    }
    return true;
  }

  // ---------- rendering: tabs ----------
  function renderSectionTabs() {
    const tabsHtml = SECTIONS.map(section => {
      const count = section.sheetKeys.reduce((sum, k) => sum + SHEET_BY_KEY[k].rows.length, 0);
      const active = state.sectionId === section.id;
      return `<button class="section-btn ${active ? "active" : ""}" data-section="${section.id}">
        <span class="section-btn-name">${escapeHtml(section.name)}</span>
        <span class="section-btn-count">${count} records</span>
      </button>`;
    });
    els.sectionTabs.innerHTML = tabsHtml.join("");
  }

  function renderSheetTabs() {
    const section = getCurrentSection();
    const html = [`<button class="tab-btn ${state.sheetKey === "all" ? "active" : ""}" data-sheet="all">All in ${escapeHtml(section.name)}</button>`];
    for (const key of section.sheetKeys) {
      const sheet = SHEET_BY_KEY[key];
      html.push(
        `<button class="tab-btn ${state.sheetKey === key ? "active" : ""}" data-sheet="${key}">${escapeHtml(sheet.name)} <span class="tab-count">${sheet.rows.length}</span></button>`
      );
    }
    els.sheetTabs.innerHTML = html.join("");
  }

  // ---------- rendering: sidebar filters ----------
  function renderFilters(searchFilteredRows, activeSheets) {
    const activeSheetKeys = new Set(activeSheets.map(s => s.key));
    const curatedSpec = (CURATED_FILTERS[state.sectionId] || [])
      .filter(def => def.sources.some(src => src.sheet === null || activeSheetKeys.has(src.sheet)));

    const curatedFacets = curatedSpec
      .map(def => computeFacetForDef(def, searchFilteredRows, { bypassCardinalityCap: true }))
      .filter(Boolean);

    const coveredColumns = new Set();
    curatedSpec.forEach(def => def.sources.forEach(src => coveredColumns.add(src.column)));

    const autoDefs = getAutoFilterDefs(activeSheets, coveredColumns);
    const autoFacets = autoDefs
      .map(def => computeFacetForDef(def, searchFilteredRows))
      .filter(Boolean)
      .sort((a, b) => b.coverage - a.coverage); // most broadly-applicable filters first

    currentFilterDefs = curatedFacets.map(f => f.def).concat(autoFacets.map(f => f.def));

    if (curatedFacets.length === 0 && autoFacets.length === 0) {
      els.filterGroups.innerHTML = `<p class="no-filters">No categorical fields to filter for this view.</p>`;
      return;
    }

    const parts = [];
    if (curatedFacets.length > 0) {
      parts.push(`<div class="filter-tier-label">Primary filters</div>`);
      curatedFacets.forEach(facet => parts.push(renderFacetGroup(facet)));
    }
    if (autoFacets.length > 0) {
      parts.push(`<div class="filter-tier-label">More filters</div>`);
      autoFacets.forEach(facet => parts.push(renderFacetGroup(facet)));
    }

    els.filterGroups.innerHTML = parts.join("");
  }

  function renderFacetGroup(facet) {
    const key = facet.def.key;
    const label = facet.def.label;
    const selected = state.filters[key] || new Set();
    const entries = Array.from(facet.tokenCounts.entries())
      .sort((a, b) => b[1].idSet.size - a[1].idSet.size || a[1].label.localeCompare(b[1].label));

    const groupId = `fg-${key}`.replace(/[^a-zA-Z0-9-]/g, "_");
    const visible = entries.slice(0, FACET_MAX_VISIBLE);
    const hidden = entries.slice(FACET_MAX_VISIBLE);

    const html = [`<div class="filter-group" data-group="${groupId}">`];
    html.push(`<div class="filter-col-title">${escapeHtml(label)}</div>`);
    html.push(renderFacetOptions(visible, key, selected));
    if (hidden.length > 0) {
      html.push(`<div class="facet-hidden" hidden>${renderFacetOptions(hidden, key, selected)}</div>`);
      html.push(`<button class="facet-more" data-toggle="${groupId}">+${hidden.length} more</button>`);
    }
    html.push(`</div>`);
    return html.join("");
  }

  function renderFacetOptions(entries, key, selectedSet) {
    return entries.map(([normToken, { label, idSet }]) => {
      const checked = selectedSet.has(normToken) ? "checked" : "";
      const safeToken = escapeHtml(normToken);
      const safeLabel = escapeHtml(label);
      return `<label class="facet-option">
        <input type="checkbox" data-key="${escapeHtml(key)}" data-token="${safeToken}" ${checked}>
        <span class="facet-label">${safeLabel}</span>
        <span class="facet-count">${idSet.size}</span>
      </label>`;
    }).join("");
  }

  // ---------- rendering: cards ----------
  function buildPreview(sheet, row) {
    const bits = [];
    for (const col of sheet.columns) {
      if (col === sheet.titleField) continue;
      const val = row[col];
      if (!val) continue;
      if (String(val).length > 140) continue;
      bits.push(`<b>${escapeHtml(col)}:</b> ${escapeHtml(val)}`);
      if (bits.length === 2) break;
    }
    return bits.join(" &nbsp;&middot;&nbsp; ");
  }

  function buildBody(sheet, row) {
    const fields = [];
    for (const col of sheet.columns) {
      if (col === sheet.titleField) continue;
      const val = row[col];
      if (!val) continue;
      const long = String(val).length > 90;
      fields.push(`<div class="rec-field${long ? " span-2" : ""}">
        <dt>${escapeHtml(col)}</dt>
        <dd>${linkify(val)}</dd>
      </div>`);
    }
    return `<dl class="rec-body">${fields.join("")}</dl>`;
  }

  function renderCards(rows) {
    if (rows.length === 0) {
      els.emptyState.hidden = false;
      els.cardList.innerHTML = "";
      return;
    }
    els.emptyState.hidden = true;

    const sorted = rows.slice().sort((a, b) => {
      const sheetA = SHEET_BY_KEY[a._sheet], sheetB = SHEET_BY_KEY[b._sheet];
      const ta = String(a[sheetA.titleField] || "");
      const tb = String(b[sheetB.titleField] || "");
      return ta.localeCompare(tb);
    });

    const html = sorted.map(row => {
      const sheet = SHEET_BY_KEY[row._sheet];
      const title = row[sheet.titleField] || Object.values(row).find(v => typeof v === "string") || "Untitled";
      return `<article class="rec-card" data-section="${sheet.section}" data-id="${row._id}">
        <div class="rec-head" data-expand="${row._id}">
          <div class="rec-heading">
            <span class="rec-sheet-tag">${escapeHtml(sheet.name)}</span>
            <h3 class="rec-title">${escapeHtml(title)}</h3>
            <p class="rec-preview">${buildPreview(sheet, row)}</p>
          </div>
          <div class="rec-toggle">+</div>
        </div>
        <div class="rec-body-wrap" hidden>${buildBody(sheet, row)}</div>
      </article>`;
    });

    els.cardList.innerHTML = html.join("");
  }

  // ---------- main render pipeline ----------
  function render() {
    renderSectionTabs();
    renderSheetTabs();

    const activeSheets = getSheetsForCurrentTab();
    const activeRows = getActiveRows(activeSheets);

    let searchFiltered = activeRows;
    if (state.query.trim().length > 0) {
      const fuse = getFuse(activeSheets, activeRows);
      searchFiltered = fuse.search(state.query.trim()).map(r => r.item);
    }

    renderFilters(searchFiltered, activeSheets);

    const finalRows = searchFiltered.filter(rowMatchesFilters);
    renderCards(finalRows);

    const totalInView = activeRows.length;
    els.resultTally.innerHTML = `<strong>${finalRows.length}</strong> of ${totalInView} records`;
    els.clearSearch.classList.toggle("visible", state.query.length > 0);
  }

  // ---------- event wiring ----------
  els.sectionTabs.addEventListener("click", e => {
    const btn = e.target.closest("[data-section]");
    if (!btn || btn.dataset.section === state.sectionId) return;
    state.sectionId = btn.dataset.section;
    state.sheetKey = "all";
    state.filters = {};
    state.query = "";
    els.searchInput.value = "";
    render();
  });

  els.sheetTabs.addEventListener("click", e => {
    const btn = e.target.closest("[data-sheet]");
    if (!btn) return;
    state.sheetKey = btn.dataset.sheet;
    state.filters = {};
    render();
  });

  let searchDebounce;
  els.searchInput.addEventListener("input", e => {
    state.query = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(render, 120);
  });

  els.clearSearch.addEventListener("click", () => {
    state.query = "";
    els.searchInput.value = "";
    render();
    els.searchInput.focus();
  });

  els.filterGroups.addEventListener("change", e => {
    const input = e.target.closest("input[type=checkbox]");
    if (!input) return;
    const key = input.dataset.key;
    const token = input.dataset.token;
    if (!state.filters[key]) state.filters[key] = new Set();
    if (input.checked) state.filters[key].add(token);
    else state.filters[key].delete(token);
    render();
  });

  els.filterGroups.addEventListener("click", e => {
    const moreBtn = e.target.closest(".facet-more");
    if (!moreBtn) return;
    const group = moreBtn.closest(".filter-group");
    const hiddenBlock = group.querySelector(".facet-hidden");
    const isHidden = hiddenBlock.hasAttribute("hidden");
    if (isHidden) {
      hiddenBlock.removeAttribute("hidden");
      moreBtn.textContent = "Show less";
    } else {
      hiddenBlock.setAttribute("hidden", "");
      moreBtn.textContent = `+${hiddenBlock.querySelectorAll("input").length} more`;
    }
  });

  function resetAll() {
    state.query = "";
    state.filters = {};
    els.searchInput.value = "";
    render();
  }
  els.resetFilters.addEventListener("click", resetAll);
  els.emptyReset.addEventListener("click", resetAll);

  els.cardList.addEventListener("click", e => {
    const head = e.target.closest("[data-expand]");
    if (!head) return;
    const card = head.closest(".rec-card");
    const body = card.querySelector(".rec-body-wrap");
    const expanded = card.classList.toggle("expanded");
    body.hidden = !expanded;
  });

  // ---------- init ----------
  render();
})();

</script>
</body>
</html>
